<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>武術協會管理中心</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    Arial,
    sans-serif;

  background: #f4f6f8;

  color: #222;

}

.container {

  max-width: 1200px;

  margin: auto;

  padding: 20px;

}

.header {

  background:
    linear-gradient(
      135deg,
      #111827,
      #374151
    );

  color: white;

  border-radius: 20px;

  padding: 25px;

  margin-bottom: 20px;

}

.header h1 {

  margin: 0 0 8px;

}

.header p {

  margin: 0;

  opacity: .8;

}

.course {

  background: white;

  border-radius: 18px;

  padding: 20px;

  margin-bottom: 20px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.06);

}

.course-title {

  font-size: 22px;

  font-weight: bold;

}

.course-id {

  color: #64748b;

  margin-top: 5px;

}

.stats {

  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  gap: 15px;

  margin-bottom: 20px;

}

.stat {

  background: white;

  border-radius: 18px;

  padding: 20px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.06);

}

.stat-number {

  font-size: 32px;

  font-weight: bold;

  margin-top: 8px;

}

.green {
  color: #06c755;
}

.red {
  color: #d93025;
}

.blue {
  color: #2563eb;
}

.section {

  background: white;

  border-radius: 18px;

  padding: 20px;

  margin-bottom: 20px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.06);

}

.section h2 {

  margin-top: 0;

}

button {

  border: 0;

  border-radius: 10px;

  padding: 10px 16px;

  background: #111827;

  color: white;

  font-size: 14px;

  cursor: pointer;

}

button:hover {

  opacity: .9;

}

button:disabled {

  opacity: .5;

  cursor: not-allowed;

}

.btn-green {

  background: #16a34a;

}

.btn-blue {

  background: #2563eb;

}

.btn-red {

  background: #dc2626;

}

.btn-gray {

  background: #64748b;

}

.btn-orange {

  background: #ea580c;

}

.btn-purple {

  background: #7c3aed;

}

.toolbar {

  display: flex;

  gap: 10px;

  flex-wrap: wrap;

  margin-bottom: 15px;

}

.table-wrap {

  overflow-x: auto;

}

table {

  width: 100%;

  border-collapse: collapse;

  min-width: 700px;

}

th,
td {

  padding: 12px 10px;

  border-bottom: 1px solid #eee;

  text-align: left;

}

th {

  background: #f8fafc;

  white-space: nowrap;

}

td {

  vertical-align: middle;

}

.badge {

  display: inline-block;

  padding: 5px 10px;

  border-radius: 20px;

  font-size: 13px;

}

.badge-ok {

  background: #dcfce7;

  color: #15803d;

}

.badge-no {

  background: #fee2e2;

  color: #b91c1c;

}

.badge-line {

  background: #dcfce7;

  color: #15803d;

}

.badge-blue {

  background: #dbeafe;

  color: #1d4ed8;

}

.badge-gray {

  background: #e5e7eb;

  color: #374151;

}

.form-grid {

  display: grid;

  grid-template-columns:
    repeat(2,1fr);

  gap: 15px;

}

.form-group {

  display: flex;

  flex-direction: column;

  gap: 6px;

}

.form-group.full {

  grid-column: 1 / -1;

}

label {

  font-weight: 600;

  font-size: 14px;

}

input,
select {

  width: 100%;

  padding: 11px 12px;

  border: 1px solid #d1d5db;

  border-radius: 10px;

  font-size: 15px;

  background: white;

}

input:focus,
select:focus {

  outline: none;

  border-color: #2563eb;

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.12);

}

.modal {

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,.55);

  display: none;

  align-items: center;

  justify-content: center;

  padding: 20px;

  z-index: 1000;

}

.modal.show {

  display: flex;

}

.modal-box {

  width: 100%;

  max-width: 650px;

  max-height: 90vh;

  overflow-y: auto;

  background: white;

  border-radius: 18px;

  padding: 22px;

}

.modal-title {

  font-size: 21px;

  font-weight: bold;

  margin-bottom: 20px;

}

.modal-actions {

  display: flex;

  gap: 10px;

  justify-content: flex-end;

  margin-top: 20px;

  flex-wrap: wrap;

}

.loading {

  text-align: center;

  padding: 40px;

}

.error {

  color: #d93025;

  white-space: pre-line;

}

.toast {

  position: fixed;

  left: 50%;

  bottom: 25px;

  transform: translateX(-50%);

  padding: 12px 20px;

  border-radius: 12px;

  color: white;

  background: #111827;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.2);

  display: none;

  z-index: 2000;

  max-width: 90%;

  text-align: center;

}

.toast.success {

  background: #15803d;

}

.toast.error {

  background: #b91c1c;

}

.empty {

  text-align: center;

  color: #64748b;

  padding: 30px;

}

.help-text {

  color: #64748b;

  font-size: 13px;

  margin-top: 4px;

}

.qr-container {

  text-align: center;

  padding: 10px 0;

}

.qr-image-box {

  display: inline-block;

  padding: 15px;

  background: white;

  border: 1px solid #e5e7eb;

  border-radius: 18px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.06);

}

.qr-image {

  width: 280px;

  height: 280px;

  display: block;

}

.qr-info {

  background: #f8fafc;

  border-radius: 14px;

  padding: 15px;

  line-height: 1.8;

  margin-bottom: 18px;

}

.qr-url {

  margin-top: 15px;

  padding: 12px;

  background: #f8fafc;

  border-radius: 10px;

  font-size: 13px;

  word-break: break-all;

  color: #475569;

}

.qr-note {

  text-align: center;

  color: #64748b;

  font-size: 13px;

  line-height: 1.7;

  margin-top: 12px;

}

.course-actions {

  display: flex;

  gap: 8px;

  flex-wrap: wrap;

}

@media(max-width:700px) {

  .container {

    padding: 12px;

  }

  .header {

    padding: 20px;

    border-radius: 15px;

  }

  .stats {

    grid-template-columns: 1fr;

  }

  .form-grid {

    grid-template-columns: 1fr;

  }

  .form-group.full {

    grid-column: auto;

  }

  .modal {

    padding: 10px;

  }

  .modal-box {

    padding: 18px;

  }

  .qr-image {

    width: 240px;

    height: 240px;

  }

}

</style>

</head>


<body>

<div class="container">

  <!-- =====================================
       HEADER
  ====================================== -->

  <div class="header">

    <h1>
      📊 武術協會管理中心
    </h1>

    <p>
      學員上課打卡管理系統 · 第 34 版
    </p>

  </div>


  <!-- =====================================
       LOADING
  ====================================== -->

  <div
    id="loading"
    class="loading"
  >

    正在載入管理資料……

  </div>


  <!-- =====================================
       APP
  ====================================== -->

  <div
    id="app"
    style="display:none;"
  >


    <!-- ===================================
         目前課程
    ==================================== -->

    <div class="course">

      <div
        id="courseName"
        class="course-title"
      >
        📚
      </div>

      <div
        id="courseId"
        class="course-id"
      >
      </div>

      <div id="courseDate">
      </div>

    </div>


    <!-- ===================================
         統計
    ==================================== -->

    <div class="stats">

      <div class="stat">

        👥 學員總數

        <div

          class="stat-number blue"

        </div>

      </div>


      <div class="stat">

        ✅ 今日出席

          id="todayPresent"
          class="stat-number green"
        >
          0
        </div>

      </div>


      <div class="stat">

        ❌ 今日未到

        <div
          id="todayAbsent"

        >
          0
        </div>

      </div>

    </div>


    <!-- ===================================
         課程管理
    ==================================== -->

    <div class="section">

      <h2>
        📚 課程管理
      </h2>

      <div class="toolbar">

        <button
          class="btn-green"
          onclick="openAddCourse()"

          ➕ 新增課程

        <button
          class="btn-gray"
          onclick="loadCourses()"
        >
          🔄 重新整理課程
        </button>

      </div>


      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>
                課程編號
              </th>

              <th>
                課程名稱
              </th>

              <th>
                開始日期
              </th>

              <th>
                結束日期
              </th>

              <th>
                狀態
              </th>

              <th>
                操作
              </th>

            </tr>

          </thead>

          <tbody id="courseTable">
          </tbody>

        </table>

      </div>

    </div>


    <!-- ===================================
         學員管理
    ==================================== -->

    <div class="section">

      <h2>
        👥 學員管理
      </h2>

      <div class="toolbar">

        <button
          class="btn-green"
          onclick="openAddStudent()"
        >
          ➕ 新增學員
        </button>

        <button
          class="btn-gray"
          onclick="loadData()"
        >
          🔄 重新整理
        </button>

      </div>


      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>
                學員編號
              </th>

              <th>
                姓名
              </th>

              <th>
                LINE
              </th>

            </tr>

          </thead>

          <tbody id="studentTable">
          </tbody>

        </table>

      </div>

    </div>


    <!-- ===================================
         最近打卡
    ==================================== -->

    <div class="section">

      <h2>
        📋 最近打卡紀錄
      </h2>

      <div class="toolbar">

        <button
          class="btn-green"
          onclick="openAddCheckin()"
        >
          ➕ 管理員補打卡
        </button>

        <button
          class="btn-gray"
          onclick="loadData()"
        >
          🔄 重新整理
        </button>

      </div>


      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>ID</th>

              <th>日期</th>

              <th>時間</th>

              <th>學員編號</th>

              <th>姓名</th>

              <th>課程</th>

              <th>操作</th>

            </tr>

          </thead>

          <tbody id="recentTable">
          </tbody>

        </table>

      </div>

    </div>


    <!-- ===================================
         CSV
    ==================================== -->

    <div class="section">

      <h2>
        📥 資料匯出
      </h2>

      <button
        class="btn-blue"
        onclick="downloadCSV()"
      >
        📥 匯出學員 CSV
      </button>

    </div>

  </div>


  <!-- =====================================
       ERROR
  ====================================== -->

  <div
    id="error"
    class="section error"
    style="display:none;"
  >
  </div>

</div>


<!-- =====================================
     課程 Modal
===================================== -->

<div
  id="courseModal"
  class="modal"
>

  <div class="modal-box">

    <div
      id="courseModalTitle"
      class="modal-title"
    >
      ➕ 新增課程
    </div>

    <div class="form-grid">

      <div class="form-group">

        <label>
          課程編號
        </label>

        <input
          id="courseFormId"
          type="text"
          placeholder="例如：2026-01"

      <div class="form-group">

        <label>

        </label>

          id="courseFormName"
          type="text"
          placeholder="例如：2026 秋季班"

      <div class="form-group">

        <label>
          開始日期
        </label>

        <input
          id="courseFormStart"
          type="date"

      <div class="form-group">

          結束日期

        <input

<!-- =====================================
     新增學員 Modal
===================================== -->

<div
  id="studentModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-title">
      ➕ 新增學員

    <div class="form-grid">

      <div class="form-group">

        <label>
          學員編號

     TOAST
===================================== -->

<div
  id="toast"
  class="toast"

<script>

/* =========================================
   API
========================================= */

const API_URL =
'https://script.google.com/macros/s/AKfycbxvI_ERZ_yv_4nlS1geikXjNseA1tjuHAcYqAySc6RujlfJWG0egt7qZvkuKd2NU-cZuw/exec';


const ADMIN_KEY =
'wushu_admin_2026';


/* =========================================
   學員 LIFF
========================================= */

const STUDENT_LIFF_URL =
'https://liff.line.me/2011153247-E8jjjAjB';


/* =========================================
   全域資料
========================================= */

let dashboardData =
  null;


let coursesData =
  [];


let editingCourseId =
  null;


let editingCheckinId =
  null;


let currentCourseQR =
  null;


/* =========================================
   API GET
========================================= */

async function apiGet(
  action,
  params = {}
) {

  const query =
    new URLSearchParams();


  query.set(
    'action',
    action
  );


  query.set(
    'key',
    ADMIN_KEY
  );


  Object.keys(params).forEach(
    function(key) {

      const value =
        params[key];


      if (
        value !== undefined &&
        value !== null
      ) {

        query.set(
          key,
          value
        );

      }

    }
  );


  const response =
    await fetch(
      API_URL +
      '?' +
      query.toString()
    );


  if (!response.ok) {

    throw new Error(
      'HTTP ' +
      response.status
    );

  }


  const data =
    await response.json();


  if (!data.success) {

    throw new Error(
      data.message ||
      '操作失敗'
    );

  }


  return data;

}


/* =========================================
   Dashboard
========================================= */

async function loadData() {

  document
    .getElementById('loading')
    .style.display =
    'block';


  document
    .getElementById('app')
    .style.display =
    'none';


  document
    .getElementById('error')
    .style.display =
    'none';


  try {

    const data =
      await apiGet(
        'adminDashboard'
      );


    dashboardData =
      data;


    render(
      data
    );


    await loadCourses(
      false
    );


    document
      .getElementById('loading')
      .style.display =
      'none';


    document
      .getElementById('app')
      .style.display =
      'block';

  }

  catch(error) {

    document
      .getElementById('loading')
      .style.display =
      'none';


    const errorBox =
      document
        .getElementById('error');


    errorBox.innerText =
      '❌ 管理資料取得失敗\n\n' +
      error.message;


    errorBox.style.display =
      'block';

  }

}


/* =========================================
   Render
========================================= */

function render(data) {

  const course =
    data.course;


  if (course) {

    document
      .getElementById('courseName')
      .innerText =
      '📚 ' +
      (
        course.course_name ||
        course.name ||
        '本期課程'
      );


    document
      .getElementById('courseId')
      .innerText =
      course.course_id
        ? '課程編號：' +
          course.course_id
        : '';


    document
      .getElementById('courseDate')
      .innerText =
      (
        course.start_date ||
        ''
      ) +
      ' ～ ' +
      (
        course.end_date ||
        ''
      );

  }

  else {

    document
      .getElementById('courseName')
      .innerText =
      '📚 目前沒有進行中的課程';


    document
      .getElementById('courseId')
      .innerText =
      '';


    document
      .getElementById('courseDate')
      .innerText =
      '';

  }


  const statistics =
    data.statistics || {};


  document
    .getElementById('totalStudents')
    .innerText =
    statistics.totalStudents || 0;


  document
    .getElementById('todayPresent')
    .innerText =
    statistics.todayPresent || 0;


  document

function openCourseQR(
  course
) {

  if (!course) {

    showToastMessage(
      '找不到課程資料',
      'error'
    );

    return;

  }


  const courseId =
    String(
      course.course_id || ''
    ).trim();


  const courseName =
    String(
      course.course_name ||
      course.name ||
      '本期課程'
    ).trim();


  if (!courseId) {

    showToastMessage(
      '此課程沒有課程編號',
      'error'
    );

    return;

  }


  /*
   * 這就是給學員使用的網址。
   *
   * course_id 會跟著 QR Code 一起帶過去。
   */

  const studentUrl =
    STUDENT_LIFF_URL +
    '?course_id=' +
    encodeURIComponent(
      courseId
    );


  currentCourseQR = {

    course_id:
      courseId,

    course_name:
      courseName,

    start_date:
      course.start_date ||
      '',

    end_date:
      course.end_date ||
      '',

    url:
      studentUrl

  };


  document
    .getElementById(
      'qrCourseInfo'
    )
    .innerHTML =

      '<strong>' +
      escapeHTML(
        courseName
      ) +
      '</strong>' +

      '<br>' +

      '課程編號：' +
      escapeHTML(
        courseId
      ) +

      '<br>' +

      '課程期間：' +
      escapeHTML(
        course.start_date ||
        ''
      ) +

      ' ～ ' +

      escapeHTML(
        course.end_date ||
        ''
      );


  document
    .getElementById(
      'qrCourseUrl'
    )
    .innerText =
      studentUrl;


  /*
   * QR Server
   *
   * 直接把真正的學員 LIFF URL
   * 轉成 QR Code。
   */

  const qrUrl =
    'https://api.qrserver.com/v1/create-qr-code/' +
    '?size=800x800' +
    '&margin=20' +
    '&data=' +
    encodeURIComponent(
      studentUrl
    );


  const qrImage =
    document
      .getElementById(
        'courseQRImage'
      );


  qrImage.src =
    qrUrl;


  qrImage.alt =
    '課程 ' +
    courseId +
    ' QR Code';


  document
    .getElementById(
      'courseQRModal'
    )
    .classList
    .add('show');

}

    .remove('show');

}


/* =========================================
   複製 QR Code 網址
========================================= */

async function copyCourseQRUrl() {

  if (
    !currentCourseQR ||
    !currentCourseQR.url
  ) {

    showToastMessage(
      '目前沒有 QR Code',
      'error'
    );

    return;

  }


  const url =
    currentCourseQR.url;


  try {

    if (
      navigator.clipboard &&
      navigator.clipboard.writeText
    ) {

      await navigator.clipboard.writeText(
        url
      );

    }

    else {

      const textarea =
        document.createElement(
          'textarea'
        );


      textarea.value =
        url;


      textarea.style.position =
        'fixed';


      textarea.style.left =
        '-9999px';


      document
        .body
        .appendChild(
          textarea
        );


      textarea.focus();


      textarea.select();


      document.execCommand(
        'copy'
      );


      document
        .body
        .removeChild(
          textarea
        );

    }


    showToastMessage(
      '課程網址已複製',
      'success'
    );

  }

  catch(error) {

    showToastMessage(
      '複製失敗，請手動複製網址',
      'error'
    );

  }

}


/* =========================================
   下載 QR Code
========================================= */

function downloadCourseQR() {

  if (
    !currentCourseQR ||
    !currentCourseQR.url
  ) {

    showToastMessage(
      '目前沒有 QR Code',
      'error'
    );

    return;

  }


  const qrDownloadUrl =
    'https://api.qrserver.com/v1/create-qr-code/' +
    '?size=1200x1200' +
    '&margin=30' +
    '&data=' +
    encodeURIComponent(
      currentCourseQR.url
    );


  const link =
    document.createElement(
      'a'
    );


  link.href =
    qrDownloadUrl;


  link.target =
    '_blank';


  link.rel =
    'noopener';


  link.download =
    '課程QR_' +
    currentCourseQR.course_id +
    '.png';


  document
    .body
    .appendChild(
      link
    );


  link.click();


  document
    .body
    .removeChild(
      link
    );


  showToastMessage(
    'QR Code 已開啟，請長按或另存圖片',
    'success'
  );

}

          }
        );

    }


    closeCheckinModal();


    showToastMessage(
      data.message ||
      '打卡儲存成功',
      'success'
    );


    await loadData();

  }

  catch(error) {

    showToastMessage(
      '打卡儲存失敗：' +
      error.message,
      'error'
    );

  }

  finally {

    button.disabled =
      false;

  }

}

/* =========================================
   CSV
========================================= */

function downloadCSV() {

  if (!dashboardData) {

    showToastMessage(
      '目前沒有資料可以匯出',
      'error'
    );

    return;

  }


  const students =
    dashboardData.students || [];


  let csv =
    '\uFEFF學員編號,姓名,本期堂數,今日出席,LINE綁定\n';


  students.forEach(
    function(student) {

      csv +=
        csvEscape(
          student.student_id
        ) +
        ',' +
        csvEscape(
          student.name
        ) +
        ',' +
        Number(
          student.course_count || 0
        ) +
        ',' +
        (
          student.today
            ? '是'
            : '否'
        ) +
        ',' +
        (
          student.line_bound
            ? '是'
            : '否'
        ) +
        '\n';

    }
  );


  const blob =
    new Blob(
      [csv],
      {
        type:
          'text/csv;charset=utf-8;'
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      'a'
    );


  a.href =
    url;


  a.download =
    '學員出席_' +
    getToday() +
    '.csv';


  document
    .body
    .appendChild(
      a
    );


  a.click();


  document
    .body
    .removeChild(
      a
    );


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    100
  );

}


function csvEscape(
  value
) {

  const text =
    String(
      value ?? ''
    );


  return '"' +
    text.replace(
      /"/g,
      '""'
    ) +
    '"';

}


/* =========================================
   HTML Escape
========================================= */

function escapeHTML(
  value
) {

  return String(
    value ?? ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}


/* =========================================
   Boolean
========================================= */

function normalizeBoolean(
  value
) {

  if (
    value === true ||
    value === 1
  ) {

    return true;

  }


  const text =
    String(
      value ?? ''
    )
    .trim()
    .toLowerCase();


  return !(
    text === 'false' ||
    text === 'no' ||
    text === '否' ||
    text === '0' ||
    text === ''
  );

}


/* =========================================
   時間
========================================= */

function normalizeTimeForInput(
  value
) {

  const text =
    String(
      value || ''
    ).trim();


  if (!text) {

    return '12:00';

  }


  const match =
    text.match(
      /^(\d{1,2}):(\d{2})/
    );


  if (!match) {

    return '12:00';

  }


  return (
    String(
      Number(
        match[1]
      )
    ).padStart(
      2,
      '0'
    ) +
    ':' +
    match[2]
  );

}


/* =========================================
   今日日期
========================================= */

function getToday() {

  const d =
    new Date();


  const year =
    d.getFullYear();


  const month =
    String(
      d.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  const day =
    String(
      d.getDate()
    ).padStart(
      2,
      '0'
    );


  return (
    year +
    '-' +
    month +
    '-' +
    day
  );

}


/* =========================================
   Toast
========================================= */

let toastTimer =
  null;


function showToastMessage(
  message,
  type
) {

  const toast =
    document
      .getElementById(
        'toast'
      );


  toast.innerText =
    message;


  toast.className =
    'toast ' +
    (
      type === 'success'
        ? 'success'
        : type === 'error'
          ? 'error'
          : ''
    );


  toast.style.display =
    'block';


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function() {

        toast.style.display =
          'none';

      },
      3000
    );

}
