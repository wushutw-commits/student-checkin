<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學員上課打卡</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f6f8;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        Arial,
        sans-serif;
      color: #222;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin: 15px 0 20px;
    }

    .header .icon {
      font-size: 42px;
    }

    .header h1 {
      margin: 8px 0 5px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #777;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .student-name {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .student-id {
      color: #666;
      font-size: 15px;
    }

    .course-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .course-date {
      color: #666;
      line-height: 1.8;
    }

    .count-box {
      text-align: center;
      background: #f0fff5;
      border-radius: 18px;
      padding: 20px 10px;
      border: 1px solid #d8f5e3;
    }

    .count-label {
      color: #555;
      font-size: 16px;
    }

    .count-number {
      color: #06c755;
      font-size: 52px;
      font-weight: bold;
      line-height: 1.2;
      margin: 5px 0;
    }

    .count-unit {
      color: #555;
    }

    .status {
      text-align: center;
      padding: 15px;
      border-radius: 14px;
      font-weight: bold;
      line-height: 1.6;
      white-space: pre-line;
    }

    .status-success {
      background: #edfff3;
      color: #06a847;
    }

    .status-warning {
      background: #fff8e5;
      color: #b77900;
    }

    .status-error {
      background: #fff0f0;
      color: #d93025;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 17px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      background: #b9b9b9 !important;
      cursor: not-allowed;
    }

    .checkin-button,
    .login-button {
      background: #06c755;
      color: white;
    }

    .refresh-button {
      background: #eef1f3;
      color: #333;
      font-size: 16px;
    }

    .record {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .record:last-child {
      border-bottom: none;
    }

    .record-date {
      font-weight: bold;
    }

    .record-time {
      color: #777;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 15px 0;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #777;
      line-height: 1.8;
    }

    .hidden {
      display: none !important;
    }

    .small {
      font-size: 13px;
      color: #888;
      text-align: center;
      margin-top: 20px;
    }

    label {
      display: block;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 7px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- 載入 -->
  <div id="loading" class="loading">
    <div style="font-size:40px;">📚</div>
    正在載入學員資料……
  </div>


  <!-- LINE 登入 -->
  <div id="loginPage" class="hidden">

    <div class="header">
      <div class="icon">📚</div>
      <h1>學員上課打卡</h1>
      <p>請先使用 LINE 登入</p>
    </div>

    <div class="card">

      <div
        id="loginMessage"
        class="status status-warning"
      >
        尚未登入 LINE
      </div>

      <button
        class="login-button"
        onclick="login()"
      >
        使用 LINE 登入
      </button>

    </div>

  </div>


  <!-- 綁定 -->
  <div id="bindPage" class="hidden">

    <div class="header">
      <div class="icon">📚</div>
      <h1>學員上課打卡</h1>
      <p>第一次使用請綁定學員</p>
    </div>

    <div class="card">

      <div
        id="bindMessage"
        class="status status-warning"
      >
        請輸入你的學員編號與姓名
      </div>

      <div style="margin-top:18px;">

        <label>學員編號</label>

        <input
          id="studentIdInput"
          type="text"
          placeholder="例如：wushu_0001"
        >

      </div>

      <div style="margin-top:15px;">

        <label>姓名</label>

        <input
          id="nameInput"
          type="text"
          placeholder="請輸入姓名"
        >

      </div>

      <button
        class="checkin-button"
        id="bindButton"
        onclick="bindStudent()"
      >
        綁定學員
      </button>

    </div>

  </div>


  <!-- 主頁 -->
  <div id="mainPage" class="hidden">

    <div class="header">

      <div class="icon">📚</div>

      <h1>學員上課打卡</h1>

      <p>歡迎回來</p>

    </div>


    <!-- 學員 -->
    <div class="card">

      <div
        class="student-name"
        id="studentName"
      >
        -
      </div>

      <div class="student-id">
        學員編號：
        <span id="studentId">-</span>
      </div>

    </div>


    <!-- 課程 -->
    <div class="card">

      <div
        class="course-title"
        id="courseName"
      >
        本期課程
      </div>

      <div
        class="course-date"
        id="courseDate"
      >
        課程期間載入中……
      </div>

    </div>


    <!-- 本期堂數 -->
    <div class="card">

      <div class="count-box">

        <div class="count-label">
          📚 本期課程累計堂數
        </div>

        <div
          class="count-number"
          id="totalPoints"
        >
          0
        </div>

        <div class="count-unit">
          堂
        </div>

      </div>

    </div>


    <!-- 今日打卡 -->
    <div class="card">

      <div
        id="todayStatus"
        class="status status-warning"
      >
        正在確認今日打卡狀態……
      </div>

      <button
        id="checkinButton"
        class="checkin-button"
        onclick="checkin()"
      >
        📚 今日上課打卡
      </button>

    </div>


    <!-- 最近紀錄 -->
    <div class="card">

      <h3>📋 最近上課紀錄</h3>

      <div id="recentRecords">
        <div class="empty">
          載入中……
        </div>
      </div>

    </div>


    <button
      class="refresh-button"
      onclick="loadDashboard()"
    >
      🔄 更新資料
    </button>

    <div class="small">
      LINE 學員上課打卡系統
    </div>

  </div>

</div>


<script>

/* =================================================
   你的正式設定
================================================= */

const LIFF_ID =
  '2011153247-E8jjjAjB';


const API_URL =
  'https://script.google.com/macros/s/AKfycbxvI_ERZ_yv_4nlS1geikXjNseA1tjuHAcYqAySc6RujlfJWG0egt7qZvkuKd2NU-cZuw/exec';


/* =================================================
   畫面工具
================================================= */

function show(id) {
  document
    .getElementById(id)
    .classList
    .remove('hidden');
}


function hide(id) {
  document
    .getElementById(id)
    .classList
    .add('hidden');
}


function setStatus(
  id,
  message,
  type
) {

  const el =
    document.getElementById(id);

  el.innerText =
    message;

  el.className =
    'status ' +
    (
      type === 'success'
        ? 'status-success'
        : type === 'error'
          ? 'status-error'
          : 'status-warning'
    );
}


/* =================================================
   API
================================================= */

async function api(
  action,
  params = {}
) {

  const url =
    new URL(API_URL);

  url.searchParams.set(
    'action',
    action
  );

  Object.keys(params).forEach(
    function(key) {

      url.searchParams.set(
        key,
        params[key]
      );

    }
  );

  const response =
    await fetch(
      url.toString()
    );

  if (!response.ok) {

    throw new Error(
      'API HTTP 錯誤：' +
      response.status
    );

  }

  return await response.json();
}


/* =================================================
   LINE 初始化
================================================= */

async function initLIFF() {

  try {

    if (
      typeof liff === 'undefined'
    ) {

      throw new Error(
        'LIFF SDK 載入失敗'
      );

    }

    await liff.init({
      liffId: LIFF_ID
    });


    if (
      !liff.isLoggedIn()
    ) {

      hide('loading');
      show('loginPage');

      return;

    }


    await loadDashboard();

  }

  catch(error) {

    hide('loading');
    show('loginPage');

    setStatus(
      'loginMessage',
      '❌ ' +
      (
        error.message ||
        error
      ),
      'error'
    );

  }

}


/* =================================================
   LINE 登入
================================================= */

function login() {

  try {

    liff.login();

  }

  catch(error) {

    setStatus(
      'loginMessage',
      '❌ LINE 登入失敗\n' +
      (
        error.message ||
        error
      ),
      'error'
    );

  }

}


/* =================================================
   LINE User ID
================================================= */

async function getLineUserId() {

  const profile =
    await liff.getProfile();

  return profile.userId;
}


/* =================================================
   Dashboard
================================================= */

async function loadDashboard() {

  try {

    hide('loginPage');
    hide('bindPage');
    hide('mainPage');
    show('loading');


    const lineUserId =
      await getLineUserId();


    const result =
      await api(
        'studentDashboard',
        {
          line_user_id:
            lineUserId
        }
      );


    if (
      result.found === false
    ) {

      hide('loading');
      show('bindPage');

      return;

    }


    if (
      result.success === false
    ) {

      throw new Error(
        result.message ||
        '無法取得資料'
      );

    }


    const student =
      result.student || {};


    document
      .getElementById(
        'studentName'
      )
      .innerText =
        student.name || '-';


    document
      .getElementById(
        'studentId'
      )
      .innerText =
        student.student_id || '-';


    /*
     * 本期堂數
     */

    const count =
      Number(
        student.total_points ??
        result.statistics?.totalPoints ??
        0
      );


    document
      .getElementById(
        'totalPoints'
      )
      .innerText =
        count;


    /*
     * 課程
     */

    const course =
      result.course;


    if (course) {

      document
        .getElementById(
          'courseName'
        )
        .innerText =
          course.name ||
          '本期課程';


      document
        .getElementById(
          'courseDate'
        )
        .innerText =
          (
            course.start_date || ''
          ) +
          ' ～ ' +
          (
            course.end_date || ''
          );

    }

    else {

      document
        .getElementById(
          'courseName'
        )
        .innerText =
          '目前沒有進行中的課程';

      document
        .getElementById(
          'courseDate'
        )
        .innerText =
          '';

    }


    /*
     * 今日狀態
     */

    const today =
      result.today || {};


    const button =
      document
        .getElementById(
          'checkinButton'
        );


    if (
      today.checkedIn
    ) {

      setStatus(
        'todayStatus',
        '✅ 今日已完成打卡' +
        (
          today.time
            ? '\n打卡時間：' +
              today.time
            : ''
        ),
        'success'
      );

      button.disabled = true;

      button.innerText =
        '✅ 今日已完成打卡';

    }

    else {

      setStatus(
        'todayStatus',
        '今天尚未打卡',
        'warning'
      );

      button.disabled = false;

      button.innerText =
        '📚 今日上課打卡';

    }


    renderRecent(
      result.recent || []
    );


    hide('loading');
    show('mainPage');

  }

  catch(error) {

    hide('loading');
    show('mainPage');

    setStatus(
      'todayStatus',
      '❌ 無法取得最新資料\n\n' +
      (
        error.message ||
        error
      ),
      'error'
    );

  }

}


/* =================================================
   綁定學員
================================================= */

async function bindStudent() {

  const studentId =
    document
      .getElementById(
        'studentIdInput'
      )
      .value
      .trim();


  const name =
    document
      .getElementById(
        'nameInput'
      )
      .value
      .trim();


  if (!studentId) {

    setStatus(
      'bindMessage',
      '請輸入學員編號',
      'error'
    );

    return;

  }


  if (!name) {

    setStatus(
      'bindMessage',
      '請輸入姓名',
      'error'
    );

    return;

  }


  const button =
    document
      .getElementById(
        'bindButton'
      );


  button.disabled = true;

  button.innerText =
    '綁定中……';


  try {

    const lineUserId =
      await getLineUserId();


    const result =
      await api(
        'bindStudent',
        {
          line_user_id:
            lineUserId,

          student_id:
            studentId,

          name:
            name
        }
      );


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        '綁定失敗'
      );

    }


    setStatus(
      'bindMessage',
      '✅ 學員綁定成功！\n\n正在載入資料……',
      'success'
    );


    setTimeout(
      loadDashboard,
      500
    );

  }

  catch(error) {

    setStatus(
      'bindMessage',
      '❌ 綁定失敗\n\n' +
      (
        error.message ||
        error
      ),
      'error'
    );


    button.disabled = false;

    button.innerText =
      '綁定學員';

  }

}


/* =================================================
   今日打卡
================================================= */

async function checkin() {

  const button =
    document
      .getElementById(
        'checkinButton'
      );


  if (
    button.disabled
  ) {

    return;

  }


  button.disabled = true;

  button.innerText =
    '打卡處理中……';


  setStatus(
    'todayStatus',
    '正在寫入打卡資料……',
    'warning'
  );


  try {

    const lineUserId =
      await getLineUserId();


    const result =
      await api(
        'checkin',
        {
          line_user_id:
            lineUserId
        }
      );


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        '打卡失敗'
      );

    }


    if (
      result.alreadyCheckedIn
    ) {

      setStatus(
        'todayStatus',
        '✅ 今日已完成打卡' +
        (
          result.time
            ? '\n打卡時間：' +
              result.time
            : ''
        ),
        'success'
      );

    }

    else {

      setStatus(
        'todayStatus',
        '🎉 今日上課打卡成功！' +
        (
          result.time
            ? '\n打卡時間：' +
              result.time
            : ''
        ),
        'success'
      );

    }


    if (
      result.total_points !==
      undefined
    ) {

      document
        .getElementById(
          'totalPoints'
        )
        .innerText =
          result.total_points;

    }


    button.innerText =
      '✅ 今日已完成打卡';


    setTimeout(
      loadDashboard,
      800
    );

  }

  catch(error) {

    setStatus(
      'todayStatus',
      '❌ 打卡失敗\n\n' +
      (
        error.message ||
        error
      ),
      'error'
    );


    button.disabled = false;

    button.innerText =
      '📚 今日上課打卡';

  }

}


/* =================================================
   最近紀錄
================================================= */

function renderRecent(records) {

  const container =
    document
      .getElementById(
        'recentRecords'
      );


  if (
    !records ||
    records.length === 0
  ) {

    container.innerHTML =
      '<div class="empty">' +
      '目前還沒有打卡紀錄' +
      '</div>';

    return;

  }


  container.innerHTML = '';


  records.forEach(
    function(record) {

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'record';


      const date =
        escapeHtml(
          record.date || ''
        );


      const time =
        escapeHtml(
          record.time || ''
        );


      div.innerHTML =
        '<div>' +
          '<div class="record-date">' +
            date +
          '</div>' +
        '</div>' +
        '<div class="record-time">' +
          '✅ ' +
          time +
        '</div>';


      container.appendChild(div);

    }
  );

}


/* =================================================
   HTML 安全
================================================= */

function escapeHtml(value) {

  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* =================================================
   啟動
================================================= */

initLIFF();

</script>

</body>
</html>
