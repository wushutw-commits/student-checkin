<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>學員上課打卡</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<!-- QR Code 產生器 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  background: #f3f6f8;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    Arial,
    sans-serif;
}

.container {
  max-width: 480px;
  margin: auto;
}

.header {
  text-align: center;
  padding: 15px 0 18px;
}

.logo {
  font-size: 45px;
}

h1 {
  margin: 8px 0 4px;
  font-size: 27px;
}

.subtitle {
  color: #777;
}

.card {
  background: #fff;
  border-radius: 20px;
  padding: 21px;
  margin-bottom: 16px;
  box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.student-name {
  font-size: 25px;
  font-weight: bold;
}

.student-id {
  margin-top: 6px;
  color: #777;
}

.course-title {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 8px;
}

.course-date {
  color: #666;
  line-height: 1.8;
}

.course-id {
  margin-top: 8px;
  color: #888;
  font-size: 14px;
}

.count-box {
  text-align: center;
  background: #effff4;
  border: 1px solid #d5f4df;
  border-radius: 18px;
  padding: 20px 10px;
}

.count-label {
  color: #555;
  font-size: 16px;
}

.count {
  color: #06c755;
  font-size: 56px;
  font-weight: bold;
  line-height: 1.2;
  margin: 5px 0;
}

.unit {
  color: #666;
}

.status {
  padding: 15px;
  border-radius: 14px;
  text-align: center;
  line-height: 1.7;
  white-space: pre-line;
  font-weight: bold;
}

.success {
  background: #edfff3;
  color: #069b43;
}

.warning {
  background: #fff8e5;
  color: #a66b00;
}

.error {
  background: #fff0f0;
  color: #d93025;
}

button {
  width: 100%;
  border: 0;
  border-radius: 15px;
  padding: 17px;
  margin-top: 11px;
  font-size: 18px;
  font-weight: bold;
}

.green {
  background: #06c755;
  color: #fff;
}

.gray {
  background: #edf0f2;
  color: #333;
}

.blue {
  background: #1976d2;
  color: #fff;
}

button:disabled {
  background: #bdbdbd;
  color: #fff;
}

.record {
  display: flex;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid #eee;
}

.record:last-child {
  border-bottom: 0;
}

.record-date {
  font-weight: bold;
}

.record-time {
  color: #777;
  font-size: 14px;
}

.record-course {
  color: #888;
  font-size: 12px;
  margin-top: 3px;
}

.empty {
  text-align: center;
  color: #888;
  padding: 15px;
}

.loading {
  text-align: center;
  padding: 70px 20px;
  color: #777;
  line-height: 2;
}

.hidden {
  display: none !important;
}

label {
  display: block;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 7px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
}

.qr-box {
  text-align: center;
  padding: 10px 0 5px;
}

#qrcode {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 20px 0;
}

#qrcode img,
#qrcode canvas {
  margin: auto;
  border: 8px solid #fff;
}

.qr-url {
  background: #f5f6f7;
  border-radius: 10px;
  padding: 12px;
  font-size: 13px;
  color: #666;
  word-break: break-all;
  text-align: left;
  line-height: 1.6;
}

.qr-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 8px;
}

.qr-subtitle {
  color: #777;
  font-size: 14px;
  line-height: 1.6;
}

.footer {
  text-align: center;
  color: #999;
  font-size: 12px;
  padding: 10px 0 25px;
}

</style>

</head>

<body>

<div class="container">


<!-- ==========================================
     LOADING
========================================== -->

<div id="loading" class="loading">

  <div style="font-size:45px;">
    📚
  </div>

  正在載入學員資料……

</div>


<!-- ==========================================
     LOGIN
========================================== -->

<div id="loginPage" class="hidden">

  <div class="header">

    <div class="logo">📚</div>

    <h1>學員上課打卡</h1>

    <div class="subtitle">
      請先使用 LINE 登入
    </div>

  </div>


  <div class="card">

    <div
      id="loginMessage"
      class="status warning"
    >
      尚未登入 LINE
    </div>

    <button
      class="green"
      onclick="login()"
    >
      使用 LINE 登入
    </button>

  </div>

</div>


<!-- ==========================================
     BIND
========================================== -->

<div id="bindPage" class="hidden">

  <div class="header">

    <div class="logo">📚</div>

    <h1>學員上課打卡</h1>

    <div class="subtitle">
      第一次使用請輸入姓名
    </div>

  </div>


  <div class="card">

    <div
      id="bindMessage"
      class="status warning"
    >
      請輸入你在學員名單中的姓名
    </div>


    <div style="margin-top:18px;">

      <label>
        姓名
      </label>

      <input
        id="nameInput"
        type="text"
        placeholder="請輸入姓名"
        autocomplete="name"
      >

    </div>


    <button
      id="bindButton"
      class="green"
      onclick="bindStudent()"
    >
      確認學員
    </button>

  </div>

</div>


<!-- ==========================================
     MAIN
========================================== -->

<div id="mainPage" class="hidden">

  <div class="header">

    <div class="logo">📚</div>

    <h1>學員上課打卡</h1>

    <div class="subtitle">
      歡迎回來
    </div>

  </div>


  <!-- ======================================
       學員資料
  ====================================== -->

  <div class="card">

    <div
      id="studentName"
      class="student-name"
    >
      -
    </div>

    <div class="student-id">

      學員編號：

      <span id="studentId">
        -
      </span>

    </div>

  </div>


  <!-- ======================================
       本期課程
  ====================================== -->

  <div class="card">

    <div class="course-title">
      📅 本期課程
    </div>

    <div
      id="courseName"
      style="font-size:18px;font-weight:bold;margin-top:12px;"
    >
      載入中……
    </div>

    <div
      id="courseDate"
      class="course-date"
    >
      -
    </div>

    <div
      id="courseIdDisplay"
      class="course-id"
    >
      課程編號：讀取中……
    </div>

  </div>


  <!-- ======================================
       累計堂數
  ====================================== -->

  <div class="card">

    <div class="count-box">

      <div class="count-label">
        本期課程累計堂數
      </div>

      <div
        id="totalPoints"
        class="count"
      >
        0
      </div>

      <div class="unit">
        堂
      </div>

    </div>

  </div>


  <!-- ======================================
       今日打卡
  ====================================== -->

  <div class="card">

    <div
      id="todayStatus"
      class="status warning"
    >
      正在確認今日打卡狀態……
    </div>


    <button
      id="checkinButton"
      class="green"
      onclick="checkin()"
    >
      📚 今日上課打卡
    </button>

  </div>


  <!-- ======================================
       最近紀錄
       ★ 只顯示目前 QR Code 課程
  ====================================== -->

  <div class="card">

    <h3>
      📋 本課程最近上課紀錄
    </h3>

    <div
      id="recentCourseInfo"
      style="
        color:#888;
        font-size:13px;
        margin-bottom:10px;
      "
    >
      課程：讀取中……
    </div>

    <div id="recentRecords">

      <div class="empty">
        載入中……
      </div>

    </div>

  </div>


  <!-- ======================================
       更新資料
  ====================================== -->

  <button
    class="gray"
    onclick="loadDashboard()"
  >
    🔄 更新資料
  </button>


  <!-- ======================================
       QR CODE 產生器
  ====================================== -->

  <div class="card">

    <div class="qr-title">
      📱 產生課程 QR Code
    </div>

    <div class="qr-subtitle">
      輸入課程編號後，系統會自動產生該課程專用 QR Code。
    </div>


    <div style="margin-top:18px;">

      <label>
        課程編號
      </label>

      <input
        id="qrCourseIdInput"
        type="text"
        placeholder="例如：2026-89"
      >

    </div>


    <button
      class="blue"
      onclick="generateCourseQR()"
    >
      📱 產生課程 QR Code
    </button>


    <div
      id="qrResult"
      class="qr-box hidden"
    >

      <div
        style="
          margin-top:18px;
          font-size:18px;
          font-weight:bold;
        "
      >
        課程 QR Code
      </div>


      <div
        id="generatedCourseId"
        style="
          color:#06c755;
          font-weight:bold;
          margin-top:6px;
        "
      >
      </div>


      <div id="qrcode"></div>


      <div
        id="generatedUrl"
        class="qr-url"
      >
      </div>


      <button
        class="green"
        onclick="downloadQRCode()"
      >
        ⬇️ 下載 QR Code
      </button>

    </div>

  </div>


  <div class="footer">
    LINE 學員上課打卡系統
  </div>

</div>

</div>


<script>

/* ==========================================
   正式設定
========================================== */

const LIFF_ID =
  '2011153247-E8jjjAjB';


const API_URL =
  'https://script.google.com/macros/s/AKfycbxvI_ERZ_yv_4nlS1geikXjNseA1tjuHAcYqAySc6RujlfJWG0egt7qZvkuKd2NU-cZuw/exec';


/* ==========================================
   QR Code 課程
========================================== */

const COURSE_ID =
  new URLSearchParams(
    window.location.search
  ).get('course_id') || '';


/* ==========================================
   畫面
========================================== */

function show(id) {

  document
    .getElementById(id)
    .classList
    .remove('hidden');

}


function hide(id) {

  document
    .getElementById(id)
    .classList
    .add('hidden');

}


function status(id, message, type) {

  const el =
    document.getElementById(id);

  el.innerText =
    message;

  el.className =
    'status ' +
    (
      type === 'success'
        ? 'success'
        : type === 'error'
          ? 'error'
          : 'warning'
    );

}


/* ==========================================
   課程資訊
========================================== */

function updateCourseIdDisplay() {

  const el =
    document.getElementById(
      'courseIdDisplay'
    );

  if (!el) return;


  if (COURSE_ID) {

    el.innerText =
      '課程編號：' +
      COURSE_ID;

  }

  else {

    el.innerText =
      '⚠️ 尚未指定課程';

  }

}


/* ==========================================
   API
========================================== */

async function api(
  action,
  params = {}
) {

  const url =
    new URL(API_URL);

  url.searchParams.set(
    'action',
    action
  );


  Object.keys(params)
    .forEach(function(key) {

      if (
        params[key] !== undefined &&
        params[key] !== null
      ) {

        url.searchParams.set(
          key,
          params[key]
        );

      }

    });


  const response =
    await fetch(
      url.toString()
    );


  if (!response.ok) {

    throw new Error(
      'API HTTP 錯誤：' +
      response.status
    );

  }


  return await response.json();

}


/* ==========================================
   LINE
========================================== */

async function getLineUserId() {

  const profile =
    await liff.getProfile();

  return profile.userId;

}


async function initLIFF() {

  try {

    if (
      typeof liff === 'undefined'
    ) {

      throw new Error(
        'LIFF SDK 載入失敗'
      );

    }


    updateCourseIdDisplay();


    /*
     * QR Code 產生器預填
     *
     * 如果目前就是從某個課程 QR Code 進來，
     * 自動把目前課程編號填入。
     */

    if (COURSE_ID) {

      document
        .getElementById(
          'qrCourseIdInput'
        )
        .value =
          COURSE_ID;

    }


    await liff.init({
      liffId: LIFF_ID
    });


    if (
      !liff.isLoggedIn()
    ) {

      hide('loading');

      show('loginPage');


      if (COURSE_ID) {

        status(
          'loginMessage',
          '目前課程：' +
          COURSE_ID +
          '\n\n請使用 LINE 登入',
          'warning'
        );

      }

      else {

        status(
          'loginMessage',
          '⚠️ 尚未指定課程\n\n請確認你是從課程 QR Code 進入。',
          'warning'
        );

      }

      return;

    }


    await loadDashboard();

  }

  catch(error) {

    hide('loading');

    show('loginPage');

    status(
      'loginMessage',
      '❌ ' +
      (error.message || error),
      'error'
    );

  }

}


function login() {

  liff.login();

}


/* ==========================================
   Dashboard
========================================== */

async function loadDashboard() {

  try {

    hide('loginPage');
    hide('bindPage');
    hide('mainPage');

    show('loading');


    updateCourseIdDisplay();


    const lineUserId =
      await getLineUserId();


    if (!COURSE_ID) {

      throw new Error(
        '目前網址沒有 course_id，請使用課程 QR Code 進入。'
      );

    }


    const result =
      await api(
        'studentDashboard',
        {
          line_user_id:
            lineUserId,

          course_id:
            COURSE_ID
        }
      );


    /*
     * 尚未綁定
     */

    if (
      result.found === false
    ) {

      hide('loading');

      show('bindPage');

      return;

    }


    if (
      result.success === false
    ) {

      throw new Error(
        result.message ||
        '無法取得學員資料'
      );

    }


    /* ======================================
       學員資料
    ====================================== */

    const student =
      result.student || {};


    document
      .getElementById(
        'studentName'
      )
      .innerText =
        student.name || '-';


    document
      .getElementById(
        'studentId'
      )
      .innerText =
        student.student_id || '-';


    /* ======================================
       累計堂數
    ====================================== */

    let count = 0;


    if (
      student.total_points !==
      undefined &&
      student.total_points !==
      null &&
      student.total_points !== ''
    ) {

      count =
        Number(
          student.total_points
        );

    }


    if (
      result.statistics &&
      result.statistics.totalPoints !==
      undefined
    ) {

      count =
        Number(
          result.statistics.totalPoints
        );

    }


    document
      .getElementById(
        'totalPoints'
      )
      .innerText =
        Number.isFinite(count)
          ? count
          : 0;


    /* ======================================
       課程
    ====================================== */

    const course =
      result.course || null;


    if (course) {

      document
        .getElementById(
          'courseName'
        )
        .innerText =
          course.name ||
          course.course_name ||
          '本期課程';


      const start =
        course.start_date || '';


      const end =
        course.end_date || '';


      document
        .getElementById(
          'courseDate'
        )
        .innerText =
        start || end
          ? start + ' ～ ' + end
          : '課程期間未設定';

    }

    else {

      document
        .getElementById(
          'courseName'
        )
        .innerText =
          '指定課程：' +
          COURSE_ID;


      document
        .getElementById(
          'courseDate'
        )
        .innerText =
          '課程資料等待後端確認';

    }


    /* ======================================
       最近紀錄
       ★ 只顯示目前 QR Code 課程
    ====================================== */

    document
      .getElementById(
        'recentCourseInfo'
      )
      .innerText =
        '目前課程：' +
        COURSE_ID;


    renderRecent(
      result.recent || []
    );


    /* ======================================
       今日
    ====================================== */

    const today =
      result.today || {};


    const button =
      document
        .getElementById(
          'checkinButton'
        );


    if (
      today.checkedIn === true
    ) {

      status(
        'todayStatus',
        '✅ 今日已完成打卡' +
        (
          today.time
            ? '\n打卡時間：' +
              today.time
            : ''
        ),
        'success'
      );


      button.disabled =
        true;


      button.innerText =
        '✅ 今日已完成打卡';

    }

    else {

      status(
        'todayStatus',
        '今天尚未打卡',
        'warning'
      );


      button.disabled =
        false;


      button.innerText =
        '📚 今日上課打卡';

    }


    hide('loading');

    show('mainPage');

  }

  catch(error) {

    hide('loading');

    show('mainPage');


    status(
      'todayStatus',
      '❌ 無法取得最新資料\n\n' +
      (error.message || error),
      'error'
    );

  }

}


/* ==========================================
   綁定學員
========================================== */

async function bindStudent() {

  const name =
    document
      .getElementById(
        'nameInput'
      )
      .value
      .trim();


  if (!name) {

    status(
      'bindMessage',
      '請輸入姓名',
      'error'
    );

    return;

  }


  const button =
    document
      .getElementById(
        'bindButton'
      );


  button.disabled =
    true;

  button.innerText =
    '查詢中……';


  try {

    const lineUserId =
      await getLineUserId();


    const result =
      await api(
        'bindStudent',
        {
          line_user_id:
            lineUserId,

          name:
            name
        }
      );


    if (
      result.success !== true
    ) {

      throw new Error(
        result.message ||
        '找不到學員'
      );

    }


    status(
      'bindMessage',
      '✅ 學員確認成功！\n\n正在載入資料……',
      'success'
    );


    setTimeout(
      loadDashboard,
      500
    );

  }

  catch(error) {

    status(
      'bindMessage',
      '❌ ' +
      (error.message || error),
      'error'
    );


    button.disabled =
      false;

    button.innerText =
      '確認學員';

  }

}


/* ==========================================
   打卡
========================================== */

async function checkin() {

  const button =
    document
      .getElementById(
        'checkinButton'
      );


  if (
    button.disabled
  ) {

    return;

  }


  if (!COURSE_ID) {

    status(
      'todayStatus',
      '❌ 無法打卡\n\n' +
      '目前沒有指定課程。\n' +
      '請掃描正確的課程 QR Code。',
      'error'
    );

    return;

  }


  button.disabled =
    true;

  button.innerText =
    '打卡處理中……';


  status(
    'todayStatus',
    '正在寫入打卡資料……',
    'warning'
  );


  try {

    const lineUserId =
      await getLineUserId();


    const result =
      await api(
        'checkin',
        {
          line_user_id:
            lineUserId,

          course_id:
            COURSE_ID
        }
      );


    if (
      result.success !== true
    ) {

      throw new Error(
        result.message ||
        '打卡失敗'
      );

    }


    if (
      result.alreadyCheckedIn === true
    ) {

      status(
        'todayStatus',
        '✅ 今日已完成打卡' +
        (
          result.time
            ? '\n打卡時間：' +
              result.time
            : ''
        ),
        'success'
      );

    }

    else {

      status(
        'todayStatus',
        '🎉 今日上課打卡成功！' +
        (
          result.time
            ? '\n打卡時間：' +
              result.time
            : ''
        ),
        'success'
      );

    }


    if (
      result.total_points !==
      undefined
    ) {

      document
        .getElementById(
          'totalPoints'
        )
        .innerText =
          result.total_points;

    }


    button.innerText =
      '✅ 今日已完成打卡';


    setTimeout(
      loadDashboard,
      800
    );

  }

  catch(error) {

    status(
      'todayStatus',
      '❌ 打卡失敗\n\n' +
      (error.message || error),
      'error'
    );


    button.disabled =
      false;

    button.innerText =
      '📚 今日上課打卡';

  }

}


/* ==========================================
   最近紀錄
   ★ 只顯示目前 course_id
========================================== */

function renderRecent(records) {

  const container =
    document
      .getElementById(
        'recentRecords'
      );


  if (
    !Array.isArray(records)
  ) {

    container.innerHTML =
      '<div class="empty">' +
      '目前還沒有打卡紀錄' +
      '</div>';

    return;

  }


  /*
   * ★ 關鍵：
   *
   * 只保留目前 QR Code 課程。
   *
   * 後端 recent 每筆紀錄需要有
   * record.course_id。
   */

  const filtered =
    records.filter(
      function(record) {

        return String(
          record.course_id || ''
        ).trim() ===
        String(
          COURSE_ID
        ).trim();

      }
    );


  if (
    filtered.length === 0
  ) {

    container.innerHTML =
      '<div class="empty">' +
      '目前這門課程還沒有打卡紀錄' +
      '</div>';

    return;

  }


  container.innerHTML = '';


  filtered.forEach(
    function(record) {

      const row =
        document.createElement(
          'div'
        );


      row.className =
        'record';


      const date =
        escapeHtml(
          record.date || ''
        );


      const time =
        escapeHtml(
          record.time || ''
        );


      row.innerHTML =
        '<div>' +

          '<div class="record-date">' +
            date +
          '</div>' +

          '<div class="record-course">' +
            '課程：' +
            escapeHtml(
              record.course_id || COURSE_ID
            ) +
          '</div>' +

        '</div>' +

        '<div class="record-time">' +
          '✅ ' +
          time +
        '</div>';


      container.appendChild(
        row
      );

    }
  );

}


/* ==========================================
   QR Code 產生器
========================================== */

let generatedQR = null;


function generateCourseQR() {

  const input =
    document
      .getElementById(
        'qrCourseIdInput'
      );


  const courseId =
    input.value.trim();


  if (!courseId) {

    alert(
      '請先輸入課程編號，例如：2026-89'
    );

    return;

  }


  /*
   * 產生 LIFF 課程網址
   */

  const liffUrl =
    'https://liff.line.me/' +
    LIFF_ID +
    '?course_id=' +
    encodeURIComponent(
      courseId
    );


  /*
   * 清除舊 QR Code
   */

  const qrContainer =
    document.getElementById(
      'qrcode'
    );


  qrContainer.innerHTML =
    '';


  /*
   * 產生新的 QR Code
   */

  generatedQR =
    new QRCode(
      qrContainer,
      {
        text: liffUrl,

        width: 240,

        height: 240,

        colorDark: '#000000',

        colorLight: '#ffffff',

        correctLevel:
          QRCode.CorrectLevel.H
      }
    );


  document
    .getElementById(
      'generatedCourseId'
    )
    .innerText =
      '課程編號：' +
      courseId;


  document
    .getElementById(
      'generatedUrl'
    )
    .innerText =
      liffUrl;


  show('qrResult');

}


/* ==========================================
   下載 QR Code
========================================== */

function downloadQRCode() {

  const container =
    document.getElementById(
      'qrcode'
    );


  const canvas =
    container.querySelector(
      'canvas'
    );


  if (canvas) {

    const link =
      document.createElement(
        'a'
      );


    const courseId =
      document
        .getElementById(
          'qrCourseIdInput'
        )
        .value
        .trim();


    link.download =
      '課程QR-Code-' +
      courseId +
      '.png';


    link.href =
      canvas.toDataURL(
        'image/png'
      );


    link.click();

    return;

  }


  /*
   * 某些瀏覽器可能使用 img
   */

  const img =
    container.querySelector(
      'img'
    );


  if (img) {

    const link =
      document.createElement(
        'a'
      );


    const courseId =
      document
        .getElementById(
          'qrCourseIdInput'
        )
        .value
        .trim();


    link.download =
      '課程QR-Code-' +
      courseId +
      '.png';


    link.href =
      img.src;


    link.click();

    return;

  }


  alert(
    'QR Code 尚未產生'
  );

}


/* ==========================================
   安全處理
========================================== */

function escapeHtml(value) {

  return String(value || '')
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/* ==========================================
   啟動
========================================== */

initLIFF();

</script>
