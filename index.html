<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>學員上課打卡</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  background: #f3f6f8;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    Arial,
    sans-serif;
}

.container {
  max-width: 480px;
  margin: auto;
}

.header {
  text-align: center;
  padding: 15px 0 18px;
}

.logo {
  font-size: 45px;
}

h1 {
  margin: 8px 0 4px;
  font-size: 27px;
}

.subtitle {
  color: #777;
}

.card {
  background: #fff;
  border-radius: 20px;
  padding: 21px;
  margin-bottom: 16px;
  box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.student-name {
  font-size: 25px;
  font-weight: bold;
}

.student-id {
  margin-top: 6px;
  color: #777;
}

.course-title {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 8px;
}

.course-date {
  color: #666;
  line-height: 1.8;
}

.count-box {
  text-align: center;
  background: #effff4;
  border: 1px solid #d5f4df;
  border-radius: 18px;
  padding: 20px 10px;
}

.count-label {
  color: #555;
  font-size: 16px;
}

.count {
  color: #06c755;
  font-size: 56px;
  font-weight: bold;
  line-height: 1.2;
  margin: 5px 0;
}

.unit {
  color: #666;
}

.status {
  padding: 15px;
  border-radius: 14px;
  text-align: center;
  line-height: 1.7;
  white-space: pre-line;
  font-weight: bold;
}

.success {
  background: #edfff3;
  color: #069b43;
}

.warning {
  background: #fff8e5;
  color: #a66b00;
}

.error {
  background: #fff0f0;
  color: #d93025;
}

button {
  width: 100%;
  border: 0;
  border-radius: 15px;
  padding: 17px;
  margin-top: 11px;
  font-size: 18px;
  font-weight: bold;
}

.green {
  background: #06c755;
  color: #fff;
}

.gray {
  background: #edf0f2;
  color: #333;
}

button:disabled {
  background: #bdbdbd;
  color: #fff;
}

.record {
  display: flex;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid #eee;
}

.record:last-child {
  border-bottom: 0;
}

.record-date {
  font-weight: bold;
}

.record-time {
  color: #777;
  font-size: 14px;
}

.empty {
  text-align: center;
  color: #888;
  padding: 15px;
}

.loading {
  text-align: center;
  padding: 70px 20px;
  color: #777;
  line-height: 2;
}

.hidden {
  display: none !important;
}

label {
  display: block;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 7px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
}

.footer {
  text-align: center;
  color: #999;
  font-size: 12px;
  padding: 10px 0 25px;
}

</style>

</head>


<body>


<div class="container">


<!-- ==========================================
     LOADING
========================================== -->

<div id="loading" class="loading">

  <div style="font-size:45px;">
    📚
  </div>

  正在載入學員資料……

</div>


<!-- ==========================================
     LOGIN
========================================== -->

<div id="loginPage" class="hidden">

  <div class="header">

    <div class="logo">📚</div>

    <h1>學員上課打卡</h1>

    <div class="subtitle">
      請先使用 LINE 登入
    </div>

  </div>


  <div class="card">

    <div
      id="loginMessage"
      class="status warning"
    >
      尚未登入 LINE
    </div>

    <button
      class="green"
      onclick="login()"
    >
      使用 LINE 登入
    </button>

  </div>

</div>


<!-- ==========================================
     BIND
========================================== -->

<div id="bindPage" class="hidden">

  <div class="header">

    <div class="logo">📚</div>

    <h1>學員上課打卡</h1>

    <div class="subtitle">
      第一次使用請綁定學員
    </div>

  </div>


  <div class="card">

    <div
      id="bindMessage"
      class="status warning"
    >
      請輸入你的學員編號與姓名
    </div>


    <div style="margin-top:18px;">

      <label>
        學員編號
      </label>

      <input
        id="studentIdInput"
        type="text"
        placeholder="例如：wushu_0001"
        autocomplete="off"
      >

    </div>


    <div style="margin-top:16px;">

      <label>
        姓名
      </label>

      <input
        id="nameInput"
        type="text"
        placeholder="請輸入姓名"
        autocomplete="name"
      >

    </div>


    <button
      id="bindButton"
      class="green"
      onclick="bindStudent()"
    >
      綁定學員
    </button>

  </div>

</div>


<!-- ==========================================
     MAIN
========================================== -->

<div id="mainPage" class="hidden">


  <div class="header">

    <div class="logo">📚</div>

    <h1>學員上課打卡</h1>

    <div class="subtitle">
      歡迎回來
    </div>

  </div>


  <!-- 學員資料 -->

  <div class="card">

    <div
      id="studentName"
      class="student-name"
    >
      -
    </div>

    <div class="student-id">

      學員編號：

      <span id="studentId">
        -
      </span>

    </div>

  </div>


  <!-- 本期課程 -->

  <div class="card">

    <div class="course-title">
      📅 本期課程
    </div>

    <div
      id="courseName"
      style="font-size:18px;font-weight:bold;margin-top:12px;"
    >
      載入中……
    </div>

    <div
      id="courseDate"
      class="course-date"
    >
      -
    </div>

  </div>


  <!-- 累計堂數 -->

  <div class="card">

    <div class="count-box">

      <div class="count-label">
        本期課程累計堂數
      </div>

      <div
        id="totalPoints"
        class="count"
      >
        0
      </div>

      <div class="unit">
        堂
      </div>

    </div>

  </div>


  <!-- 今日 -->

  <div class="card">

    <div
      id="todayStatus"
      class="status warning"
    >
      正在確認今日打卡狀態……
    </div>


    <button
      id="checkinButton"
      class="green"
      onclick="checkin()"
    >
      📚 今日上課打卡
    </button>

  </div>


  <!-- 最近紀錄 -->

  <div class="card">

    <h3>
      📋 最近上課紀錄
    </h3>

    <div id="recentRecords">

      <div class="empty">
        載入中……
      </div>

    </div>

  </div>


  <!-- 更新 -->

  <button
    class="gray"
    onclick="loadDashboard()"
  >
    🔄 更新資料
  </button>


  <div class="footer">
    LINE 學員上課打卡系統
  </div>

</div>


</div>


<script>


/* ==========================================
   正式設定
========================================== */

const LIFF_ID =
  '2011153247-E8jjjAjB';


const API_URL =
  'https://script.google.com/macros/s/AKfycbxvI_ERZ_yv_4nlS1geikXjNseA1tjuHAcYqAySc6RujlfJWG0egt7qZvkuKd2NU-cZuw/exec';


/* ==========================================
   畫面
========================================== */

function show(id) {

  document
    .getElementById(id)
    .classList
    .remove('hidden');

}


function hide(id) {

  document
    .getElementById(id)
    .classList
    .add('hidden');

}


function status(id, message, type) {

  const el =
    document.getElementById(id);

  el.innerText =
    message;

  el.className =
    'status ' +
    (
      type === 'success'
        ? 'success'
        : type === 'error'
          ? 'error'
          : 'warning'
    );

}


/* ==========================================
   API
========================================== */

async function api(
  action,
  params = {}
) {

  const url =
    new URL(API_URL);

  url.searchParams.set(
    'action',
    action
  );


  Object.keys(params)
    .forEach(function(key) {

      url.searchParams.set(
        key,
        params[key]
      );

    });


  const response =
    await fetch(
      url.toString()
    );


  if (!response.ok) {

    throw new Error(
      'API HTTP 錯誤：' +
      response.status
    );

  }


  return await response.json();

}


/* ==========================================
   LINE
========================================== */

async function getLineUserId() {

  const profile =
    await liff.getProfile();

  return profile.userId;

}


async function initLIFF() {

  try {

    if (
      typeof liff === 'undefined'
    ) {

      throw new Error(
        'LIFF SDK 載入失敗'
      );

    }


    await liff.init({
      liffId: LIFF_ID
    });


    if (
      !liff.isLoggedIn()
    ) {

      hide('loading');

      show('loginPage');

      return;

    }


    await loadDashboard();

  }

  catch(error) {

    hide('loading');

    show('loginPage');

    status(
      'loginMessage',
      '❌ ' +
      (error.message || error),
      'error'
    );

  }

}


function login() {

  liff.login();

}


/* ==========================================
   Dashboard
========================================== */

async function loadDashboard() {

  try {

    hide('loginPage');
    hide('bindPage');
    hide('mainPage');

    show('loading');


    const lineUserId =
      await getLineUserId();


    const result =
      await api(
        'studentDashboard',
        {
          line_user_id:
            lineUserId
        }
      );


    /*
     * 尚未綁定
     */

    if (
      result.found === false
    ) {

      hide('loading');

      show('bindPage');

      return;

    }


    if (
      result.success === false
    ) {

      throw new Error(
        result.message ||
        '無法取得學員資料'
      );

    }


    const student =
      result.student || {};


    /*
     * 學員
     */

    document
      .getElementById(
        'studentName'
      )
      .innerText =
        student.name || '-';


    document
      .getElementById(
        'studentId'
      )
      .innerText =
        student.student_id || '-';


    /*
     * 本期堂數
     */

    let count = 0;


    if (
      student.total_points !==
      undefined &&
      student.total_points !==
      null &&
      student.total_points !== ''
    ) {

      count =
        Number(
          student.total_points
        );

    }


    if (
      result.statistics &&
      result.statistics.totalPoints !==
      undefined
    ) {

      count =
        Number(
          result.statistics.totalPoints
        );

    }


    document
      .getElementById(
        'totalPoints'
      )
      .innerText =
        Number.isFinite(count)
          ? count
          : 0;


    /*
     * 課程
     */

    const course =
      result.course || null;


    if (course) {

      document
        .getElementById(
          'courseName'
        )
        .innerText =
          course.name ||
          '本期課程';


      const start =
        course.start_date || '';


      const end =
        course.end_date || '';


      document
        .getElementById(
          'courseDate'
        )
        .innerText =
          start || end
            ? start + ' ～ ' + end
            : '課程期間未設定';

    }

    else {

      document
        .getElementById(
          'courseName'
        )
        .innerText =
          '目前沒有進行中的課程';


      document
        .getElementById(
          'courseDate'
        )
        .innerText =
          '';

    }


    /*
     * 今日
     */

    const today =
      result.today || {};


    const button =
      document
        .getElementById(
          'checkinButton'
        );


    if (
      today.checkedIn === true
    ) {

      status(
        'todayStatus',
        '✅ 今日已完成打卡' +
        (
          today.time
            ? '\n打卡時間：' +
              today.time
            : ''
        ),
        'success'
      );


      button.disabled =
        true;


      button.innerText =
        '✅ 今日已完成打卡';

    }

    else {

      status(
        'todayStatus',
        '今天尚未打卡',
        'warning'
      );


      button.disabled =
        false;


      button.innerText =
        '📚 今日上課打卡';

    }


    /*
     * 最近紀錄
     */

    renderRecent(
      result.recent || []
    );


    hide('loading');

    show('mainPage');

  }

  catch(error) {

    hide('loading');

    show('mainPage');


    status(
      'todayStatus',
      '❌ 無法取得最新資料\n\n' +
      (error.message || error),
      'error'
    );

  }

}


/* ==========================================
   綁定
========================================== */

async function bindStudent() {

  const id =
    document
      .getElementById(
        'studentIdInput'
      )
      .value
      .trim();


  const name =
    document
      .getElementById(
        'nameInput'
      )
      .value
      .trim();


  if (!id) {

    status(
      'bindMessage',
      '請輸入學員編號',
      'error'
    );

    return;

  }


  if (!name) {

    status(
      'bindMessage',
      '請輸入姓名',
      'error'
    );

    return;

  }


  const button =
    document
      .getElementById(
        'bindButton'
      );


  button.disabled =
    true;

  button.innerText =
    '綁定中……';


  try {

    const lineUserId =
      await getLineUserId();


    const result =
      await api(
        'bindStudent',
        {
          line_user_id:
            lineUserId,

          student_id:
            id,

          name:
            name
        }
      );


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        '綁定失敗'
      );

    }


    status(
      'bindMessage',
      '✅ 學員綁定成功！\n\n正在載入資料……',
      'success'
    );


    setTimeout(
      loadDashboard,
      500
    );

  }

  catch(error) {

    status(
      'bindMessage',
      '❌ 綁定失敗\n\n' +
      (error.message || error),
      'error'
    );


    button.disabled =
      false;

    button.innerText =
      '綁定學員';

  }

}


/* ==========================================
   打卡
========================================== */

async function checkin() {

  const button =
    document
      .getElementById(
        'checkinButton'
      );


  if (
    button.disabled
  ) {

    return;

  }


  button.disabled =
    true;

  button.innerText =
    '打卡處理中……';


  status(
    'todayStatus',
    '正在寫入打卡資料……',
    'warning'
  );


  try {

    const lineUserId =
      await getLineUserId();


    const result =
      await api(
        'checkin',
        {
          line_user_id:
            lineUserId
        }
      );


    if (
      result.success !== true
    ) {

      throw new Error(
        result.message ||
        '打卡失敗'
      );

    }


    if (
      result.alreadyCheckedIn === true
    ) {

      status(
        'todayStatus',
        '✅ 今日已完成打卡' +
        (
          result.time
            ? '\n打卡時間：' +
              result.time
            : ''
        ),
        'success'
      );

    }

    else {

      status(
        'todayStatus',
        '🎉 今日上課打卡成功！' +
        (
          result.time
            ? '\n打卡時間：' +
              result.time
            : ''
        ),
        'success'
      );

    }


    /*
     * 如果後端直接回傳最新堂數
     */

    if (
      result.total_points !==
      undefined
    ) {

      document
        .getElementById(
          'totalPoints'
        )
        .innerText =
          result.total_points;

    }


    button.innerText =
      '✅ 今日已完成打卡';


    /*
     * 重新抓完整資料
     */

    setTimeout(
      loadDashboard,
      800
    );

  }

  catch(error) {

    status(
      'todayStatus',
      '❌ 打卡失敗\n\n' +
      (error.message || error),
      'error'
    );


    button.disabled =
      false;

    button.innerText =
      '📚 今日上課打卡';

  }

}


/* ==========================================
   最近紀錄
========================================== */

function renderRecent(records) {

  const container =
    document
      .getElementById(
        'recentRecords'
      );


  if (
    !Array.isArray(records) ||
    records.length === 0
  ) {

    container.innerHTML =
      '<div class="empty">' +
      '目前還沒有打卡紀錄' +
      '</div>';

    return;

  }


  container.innerHTML = '';


  records.forEach(
    function(record) {

      const row =
        document.createElement(
          'div'
        );


      row.className =
        'record';


      const date =
        escapeHtml(
          record.date || ''
        );


      const time =
        escapeHtml(
          record.time || ''
        );


      row.innerHTML =
        '<div class="record-date">' +
          date +
        '</div>' +

        '<div class="record-time">' +
          '✅ ' +
          time +
        '</div>';


      container.appendChild(
        row
      );

    }
  );

}


/* ==========================================
   安全處理
========================================== */

function escapeHtml(value) {

  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* ==========================================
   啟動
========================================== */

initLIFF();

</script>

</body>
</html>
