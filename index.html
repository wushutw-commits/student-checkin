<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>學員上課打卡</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f5f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        Arial,
        sans-serif;
      color: #333;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 16px;
      box-shadow:
        0 4px 18px rgba(0,0,0,0.06);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 22px;
    }

    .student-name {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 5px;
    }

    .student-id {
      text-align: center;
      color: #777;
      margin-bottom: 20px;
    }

    .points {
      text-align: center;
      background: #fff7d6;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .points-label {
      color: #777;
      font-size: 14px;
    }

    .points-number {
      font-size: 42px;
      font-weight: bold;
      color: #e09b00;
      line-height: 1.2;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat {
      background: #f7f8fa;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }

    .stat-number {
      font-size: 26px;
      font-weight: bold;
      color: #333;
    }

    .stat-label {
      color: #888;
      font-size: 14px;
      margin-top: 4px;
    }

    .checkin-box {
      text-align: center;
      padding: 20px;
      border-radius: 16px;
      background: #f0fff5;
      margin-bottom: 15px;
    }

    .checkin-status {
      font-size: 20px;
      font-weight: bold;
      color: #06c755;
      margin-bottom: 8px;
    }

    .checkin-time {
      color: #777;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-green {
      background: #06c755;
      color: white;
    }

    .btn-gray {
      background: #eeeeee;
      color: #555;
    }

    button:disabled {
      opacity: 0.5;
    }

    .login-box {
      text-align: center;
    }

    .login-box p {
      color: #777;
      line-height: 1.7;
    }

    .record {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 4px;
      border-bottom: 1px solid #eee;
    }

    .record:last-child {
      border-bottom: none;
    }

    .record-date {
      font-weight: bold;
    }

    .record-time {
      color: #888;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    #message {
      text-align: center;
      padding: 10px;
      color: #666;
      white-space: pre-line;
    }

    .error {
      color: #d93025 !important;
    }

    .success {
      color: #06c755 !important;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>📚 學員上課打卡</h1>

    <div class="subtitle">
      學員專屬服務
    </div>

    <div id="message">
      正在載入 LINE...
    </div>

    <div
      id="loginBox"
      class="login-box hidden">

      <p>
        尚未登入 LINE<br>
        請使用 LINE 登入後繼續
      </p>

      <button
        class="btn-green"
        onclick="login()">
        使用 LINE 登入
      </button>

    </div>

  </div>


  <!-- 學員資料 -->

  <div
    id="studentArea"
    class="hidden">

    <div class="card">

      <div
        id="studentName"
        class="student-name">
      </div>

      <div
        id="studentId"
        class="student-id">
      </div>


      <div class="points">

        <div class="points-label">
          🎯 我的累計集點
        </div>

        <div
          id="totalPoints"
          class="points-number">
          0
        </div>

        <div class="points-label">
          點
        </div>

      </div>


      <div class="stats">

        <div class="stat">

          <div
            id="monthlyCount"
            class="stat-number">
            0
          </div>

          <div class="stat-label">
            📅 本月上課
          </div>

        </div>


        <div class="stat">

          <div
            id="totalCheckins"
            class="stat-number">
            0
          </div>

          <div class="stat-label">
            📚 累計上課
          </div>

        </div>

      </div>

    </div>


    <!-- 今日打卡 -->

    <div class="card">

      <div
        id="checkinBox"
        class="checkin-box">

        <div
          id="checkinStatus"
          class="checkin-status">
          今日尚未打卡
        </div>

        <div
          id="checkinTime"
          class="checkin-time">
        </div>

      </div>


      <button
        id="checkinButton"
        class="btn-green"
        onclick="doCheckin()">
        📚 今日上課打卡
      </button>

    </div>


    <!-- 最近紀錄 -->

    <div class="card">

      <h2>
        📋 最近上課紀錄
      </h2>

      <div id="records">
        載入中...
      </div>

    </div>

  </div>

</div>


<script>

const LIFF_ID =
  '2011153247-E8jjjAjB';


const API_URL =
  'https://script.google.com/macros/s/AKfycbxvI_ERZ_yv_4nlS1geikXjNseA1tjuHAcYqAySc6RujlfJWG0egt7qZvkuKd2NU-cZuw/exec';


const message =
  document.getElementById('message');

const loginBox =
  document.getElementById('loginBox');

const studentArea =
  document.getElementById('studentArea');

const studentName =
  document.getElementById('studentName');

const studentId =
  document.getElementById('studentId');

const totalPoints =
  document.getElementById('totalPoints');

const monthlyCount =
  document.getElementById('monthlyCount');

const totalCheckins =
  document.getElementById('totalCheckins');

const checkinStatus =
  document.getElementById('checkinStatus');

const checkinTime =
  document.getElementById('checkinTime');

const checkinButton =
  document.getElementById('checkinButton');

const records =
  document.getElementById('records');


/* =================================================
   初始化
================================================= */

async function init() {

  try {

    message.innerText =
      '正在初始化 LINE...';


    await liff.init({

      liffId:
        LIFF_ID

    });


    if (
      !liff.isLoggedIn()
    ) {

      message.innerText =
        '目前尚未登入 LINE';

      loginBox
        .classList
        .remove('hidden');

      return;

    }


    message.innerText =
      '正在取得 LINE 身分...';


    const profile =
      await liff.getProfile();


    const lineUserId =
      profile.userId;


    message.innerText =
      '正在取得學員資料...';


    const result =
      await api(
        'findStudent',
        {
          line_user_id:
            lineUserId
        }
      );


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        '無法取得學員資料'
      );

    }


    if (
      !result.found
    ) {

      message.innerText =
        'LINE 已登入，但尚未綁定學員。';

      return;

    }


    studentArea
      .classList
      .remove('hidden');

    message.innerText =
      '';


    await loadDashboard(
      lineUserId
    );


  } catch (error) {

    message.innerText =
      '❌ 發生錯誤\n\n' +
      (
        error.message ||
        error
      );

    message.className =
      'error';

  }

}


/* =================================================
   LINE 登入
================================================= */

function login() {

  try {

    liff.login();

  } catch (error) {

    message.innerText =
      '❌ LINE 登入失敗\n\n' +
      error.message;

    message.className =
      'error';

  }

}


/* =================================================
   API
================================================= */

async function api(
  action,
  params = {}
) {

  const query =
    new URLSearchParams();


  query.append(
    'action',
    action
  );


  Object.keys(params)
    .forEach(
      function(key) {

        query.append(
          key,
          params[key]
        );

      }
    );


  const url =
    API_URL +
    '?' +
    query.toString();


  const response =
    await fetch(
      url,
      {
        method: 'GET',
        cache: 'no-store'
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      'API HTTP 錯誤：' +
      response.status
    );

  }


  return await response.json();

}


/* =================================================
   取得 Dashboard
================================================= */

async function loadDashboard(
  lineUserId
) {

  const result =
    await api(
      'studentDashboard',
      {
        line_user_id:
          lineUserId
      }
    );


  if (
    !result.success
  ) {

    throw new Error(
      result.message ||
      '無法取得最新資料'
    );

  }


  renderDashboard(
    result
  );

}


/* =================================================
   顯示 Dashboard
================================================= */

function renderDashboard(
  data
) {

  const student =
    data.student;


  studentName.innerText =
    '👋 ' +
    (
      student.name ||
      ''
    );


  studentId.innerText =
    '學員編號：' +
    (
      student.student_id ||
      ''
    );


  totalPoints.innerText =
    Number(
      data.statistics.totalPoints
    ) || 0;


  monthlyCount.innerText =
    Number(
      data.statistics.monthlyCount
    ) || 0;


  totalCheckins.innerText =
    Number(
      data.statistics.totalCheckins
    ) || 0;


  /*
   * 今日狀態
   */

  if (
    data.today &&
    data.today.checkedIn
  ) {

    checkinStatus.innerText =
      '✅ 今日已完成打卡';

    checkinStatus.className =
      'checkin-status success';


    checkinTime.innerText =
      data.today.time
        ? '打卡時間：' +
          data.today.time
        : '今天已完成上課打卡';


    checkinButton.innerText =
      '✅ 今日已打卡';

    checkinButton.disabled =
      true;

  } else {

    checkinStatus.innerText =
      '📚 今日尚未打卡';

    checkinStatus.className =
      'checkin-status';


    checkinTime.innerText =
      '完成打卡即可累積 1 點';


    checkinButton.innerText =
      '📚 今日上課打卡';

    checkinButton.disabled =
      false;

  }


  /*
   * 最近紀錄
   */

  renderRecords(
    data.recent || []
  );

}


/* =================================================
   顯示紀錄
================================================= */

function renderRecords(
  list
) {

  if (
    !list ||
    list.length === 0
  ) {

    records.innerHTML =
      '<div style="color:#888;text-align:center;padding:20px;">' +
      '目前還沒有上課紀錄' +
      '</div>';

    return;

  }


  records.innerHTML =
    list
      .map(
        function(item) {

          return `
            <div class="record">

              <div>

                <div class="record-date">
                  📅 ${escapeHtml(
                    item.date || ''
                  )}
                </div>

                <div class="record-time">
                  上課打卡
                </div>

              </div>

              <div class="record-time">
                ${escapeHtml(
                  item.time || ''
                )}
              </div>

            </div>
          `;

        }
      )
      .join('');

}


/* =================================================
   打卡
================================================= */

async function doCheckin() {

  if (
    checkinButton.disabled
  ) {

    return;

  }


  try {

    checkinButton.disabled =
      true;

    checkinButton.innerText =
      '⏳ 打卡中...';


    const profile =
      await liff.getProfile();


    const result =
      await api(
        'checkin',
        {
          line_user_id:
            profile.userId
        }
      );


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        '打卡失敗'
      );

    }


    /*
     * 不論第一次打卡或今天已打卡
     * 都重新從後端讀取最新資料
     */

    await loadDashboard(
      profile.userId
    );


  } catch (error) {

    message.innerText =
      '❌ 打卡失敗\n\n' +
      (
        error.message ||
        error
      );

    message.className =
      'error';


    checkinButton.disabled =
      false;

    checkinButton.innerText =
      '📚 今日上課打卡';

  }

}


/* =================================================
   防止 HTML 注入
================================================= */

function escapeHtml(
  value
) {

  return String(
    value || ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}


/* =================================================
   啟動
================================================= */

init();

</script>

</body>
</html>
