<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>📚 學員上課打卡</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    body {
      margin: 0;
      padding: 30px 20px;
      background: #f7f7f7;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      max-width: 420px;
      margin: 30px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 25px;
    }

    #status {
      line-height: 1.8;
      white-space: pre-line;
      margin: 20px 0;
    }

    #studentInfo {
      font-size: 20px;
      font-weight: bold;
      color: #06c755;
      margin: 20px 0;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      background: #06c755;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:disabled {
      background: #999;
    }

    input {
      width: 90%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .success {
      color: #06c755;
      font-weight: bold;
    }

    .error {
      color: #d93025;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>

<div class="card">

  <h1>📚 學員上課打卡</h1>

  <div id="status">
    正在載入 LIFF SDK...
  </div>


  <div id="studentInfo"></div>


  <!-- 登入 -->

  <button id="loginButton"
          class="hidden"
          onclick="login()">
    使用 LINE 登入
  </button>


  <!-- 綁定 -->

  <div id="bindArea" class="hidden">

    <h3>🔗 綁定學員</h3>

    <p>
      請輸入你的學員編號與姓名
    </p>

    <input
      id="studentId"
      placeholder="學員編號">

    <input
      id="studentName"
      placeholder="學員姓名">

    <button onclick="bindStudent()">
      綁定本人
    </button>

  </div>

</div>


<script>


/* =========================
   基本設定
========================= */


const LIFF_ID =
  '2011153247-E8jjjAjB';


const API_URL =
  'https://script.google.com/macros/s/AKfycbxvI_ERZ_yv_4nlS1geikXjNseA1tjuHAcYqAySc6RujlfJWG0egt7qZvkuKd2NU-cZuw/exec';


const status =
  document.getElementById('status');


const loginButton =
  document.getElementById('loginButton');


const bindArea =
  document.getElementById('bindArea');


const studentInfo =
  document.getElementById('studentInfo');


/* =========================
   啟動 LIFF
========================= */


async function startLIFF() {

  try {

    status.innerText =
      'LIFF SDK 已載入，正在初始化...';


    await liff.init({
      liffId: LIFF_ID
    });


    if (!liff.isLoggedIn()) {

      status.innerText =
        '目前尚未登入 LINE';

      loginButton.classList.remove(
        'hidden'
      );

      return;
    }


    status.innerText =
      '🎉 LINE 登入成功！\n' +
      '正在取得學員資料...';


    const profile =
      await liff.getProfile();


    const lineUserId =
      profile.userId;


    await findStudent(
      lineUserId
    );


  } catch (error) {

    console.error(error);

    status.innerText =
      '❌ 發生錯誤\n\n' +
      (error.message || error);

    status.className =
      'error';

  }

}


/* =========================
   LINE 登入
========================= */


function login() {

  status.innerText =
    '正在開啟 LINE 登入...';

  loginButton.disabled =
    true;

  liff.login();

}


/* =========================
   查詢學生
========================= */


async function findStudent(
  lineUserId
) {

  try {

    const url =
      API_URL +
      '?action=findStudent' +
      '&line_user_id=' +
      encodeURIComponent(
        lineUserId
      );


    const response =
      await fetch(url);


    const result =
      await response.json();


    console.log(result);


    if (
      result.success &&
      result.found
    ) {

      const student =
        result.student;


      studentInfo.innerText =
        '👋 ' +
        student.name +
        '，歡迎上課！';


      status.innerText =
        '✅ LINE 已綁定學員';


      status.className =
        'success';


      return;

    }


    /*
     * 找不到學員
     */

    status.innerText =
      'LINE 登入成功，但目前尚未綁定學員。\n\n' +
      '請輸入你的學員編號與姓名。';


    bindArea.classList.remove(
      'hidden'
    );


  } catch (error) {

    console.error(error);

    status.innerText =
      '❌ 無法連線到學員資料庫\n\n' +
      (error.message || error);

    status.className =
      'error';

  }

}


/* =========================
   綁定學員
========================= */


async function bindStudent() {

  const studentId =
    document
      .getElementById(
        'studentId'
      )
      .value
      .trim();


  const studentName =
    document
      .getElementById(
        'studentName'
      )
      .value
      .trim();


  if (!studentId) {

    alert(
      '請輸入學員編號'
    );

    return;

  }


  if (!studentName) {

    alert(
      '請輸入學員姓名'
    );

    return;

  }


  try {

    status.innerText =
      '正在綁定學員...';


    const profile =
      await liff.getProfile();


    const lineUserId =
      profile.userId;


    const url =
      API_URL +
      '?action=bindStudent' +
      '&line_user_id=' +
      encodeURIComponent(
        lineUserId
      ) +
      '&student_id=' +
      encodeURIComponent(
        studentId
      ) +
      '&name=' +
      encodeURIComponent(
        studentName
      );


    const response =
      await fetch(url);


    const result =
      await response.json();


    console.log(result);


    if (result.success) {

      studentInfo.innerText =
        '🎉 ' +
        result.student.name +
        '，綁定成功！';


      status.innerText =
        '✅ LINE 帳號已成功綁定學員';


      status.className =
        'success';


      bindArea.classList.add(
        'hidden'
      );


    } else {

      status.innerText =
        '❌ 綁定失敗\n\n' +
        result.message;


      status.className =
        'error';

    }


  } catch (error) {

    console.error(error);

    status.innerText =
      '❌ 綁定發生錯誤\n\n' +
      (error.message || error);

    status.className =
      'error';

  }

}


/* =========================
   啟動
========================= */


startLIFF();


</script>

</body>

</html>
