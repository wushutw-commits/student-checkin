<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>學員上課打卡</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      max-width: 420px;
      margin: auto;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    #status {
      margin: 25px 0;
      line-height: 1.8;
      white-space: pre-line;
    }

    .student {
      background: #f0fff5;
      border-radius: 15px;
      padding: 20px;
      margin: 20px 0;
      line-height: 2;
    }

    .id {
      color: #06c755;
      font-size: 26px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 18px;
      border: 0;
      border-radius: 14px;
      background: #06c755;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    button:disabled {
      background: #aaa;
    }

    .success {
      color: #06c755;
    }

    .error {
      color: #d93025;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>📚 學員上課打卡</h1>

  <div id="status">
    正在載入...
  </div>

  <div id="student" class="student" style="display:none;"></div>

  <button
    id="checkinButton"
    style="display:none;"
    onclick="checkin()">
    📚 今日上課打卡
  </button>

</div>


<script>

const LIFF_ID =
  '2011153247-E8jjjAjB';

const API_URL =
  'https://script.google.com/macros/s/AKfycbxvI_ERZ_yv_4nlS1geikXjNseA1tjuHAcYqAySc6RujlfJWG0egt7qZvkuKd2NU-cZuw/exec';

let lineUserId = '';

let student = null;


const status =
  document.getElementById('status');

const studentBox =
  document.getElementById('student');

const checkinButton =
  document.getElementById('checkinButton');


/* ================================
   初始化
================================ */

async function start() {

  try {

    status.innerText =
      '正在初始化 LINE...';


    await liff.init({
      liffId: LIFF_ID
    });


    if (!liff.isLoggedIn()) {

      status.innerText =
        '目前尚未登入 LINE';

      return;
    }


    const profile =
      await liff.getProfile();


    lineUserId =
      profile.userId;


    status.innerText =
      '正在取得學員資料...';


    const result =
      await api(
        'findStudent',
        {
          line_user_id: lineUserId
        }
      );


    if (
      !result.success ||
      !result.found
    ) {

      status.innerText =
        '❌ 尚未綁定學員\n\n' +
        '請先完成學員綁定。';

      status.className =
        'error';

      return;
    }


    student =
      result.student;


    /* 顯示學員 */

    studentBox.innerHTML =
      '✅ LINE 已綁定學員<br><br>' +

      '姓名：' +
      escapeHtml(student.name) +
      '<br>' +

      '學員編號：<br>' +

      '<span class="id">' +
      escapeHtml(
        String(student.student_id)
      ) +
      '</span>';


    studentBox.style.display =
      'block';


    /* 檢查今天是否已打卡 */

    await checkStatus();


  } catch (error) {

    status.innerText =
      '❌ 發生錯誤\n\n' +
      (error.message || error);

    status.className =
      'error';

  }

}


/* ================================
   API
================================ */

async function api(
  action,
  params = {}
) {

  const query =
    new URLSearchParams();

  query.set(
    'action',
    action
  );


  Object.keys(params).forEach(
    key => {

      query.set(
        key,
        params[key]
      );

    }
  );


  const response =
    await fetch(
      API_URL +
      '?' +
      query.toString()
    );


  return await response.json();

}


/* ================================
   今日打卡狀態
================================ */

async function checkStatus() {

  const result =
    await api(
      'checkinStatus',
      {
        line_user_id:
          lineUserId
      }
    );


  if (
    result.checkedIn
  ) {

    checkinButton.disabled =
      true;

    checkinButton.innerText =
      '✅ 今日已完成打卡';

    checkinButton.style.display =
      'block';

    status.innerText =
      '今天已經打卡成功！\n\n' +
      '日期：' +
      result.date +
      '\n' +
      '時間：' +
      result.time;

    status.className =
      'success';

    return;
  }


  checkinButton.disabled =
    false;

  checkinButton.innerText =
    '📚 今日上課打卡';

  checkinButton.style.display =
    'block';


  status.innerText =
    '👋 ' +
    student.name +
    '，歡迎上課！\n\n' +
    '請按下面按鈕完成今日打卡。';

}


/* ================================
   打卡
================================ */

async function checkin() {

  checkinButton.disabled =
    true;

  checkinButton.innerText =
    '正在打卡...';

  status.innerText =
    '正在記錄上課打卡...';


  try {

    const result =
      await api(
        'checkin',
        {
          line_user_id:
            lineUserId
        }
      );


    if (!result.success) {

      throw new Error(
        result.message ||
        '打卡失敗'
      );

    }


    if (
      result.alreadyCheckedIn
    ) {

      checkinButton.innerText =
        '✅ 今日已完成打卡';

      status.innerText =
        '今天已經打卡過了。\n\n' +
        '時間：' +
        result.time;

      status.className =
        'success';

      return;
    }


    checkinButton.innerText =
      '✅ 打卡成功';

    status.innerText =
      '🎉 今日上課打卡成功！\n\n' +
      '日期：' +
      result.date +
      '\n' +
      '時間：' +
      result.time;

    status.className =
      'success';


  } catch (error) {

    checkinButton.disabled =
      false;

    checkinButton.innerText =
      '📚 今日上課打卡';

    status.innerText =
      '❌ 打卡失敗\n\n' +
      (error.message || error);

    status.className =
      'error';

  }

}


/* ================================
   防止特殊字元
================================ */

function escapeHtml(value) {

  return String(value)

    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* ================================
   開始
================================ */

start();

</script>

</body>
</html>
