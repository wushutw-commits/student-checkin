<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>學員上課打卡</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 15px 40px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
      background: #f3f7f4;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow:
        0 4px 15px rgba(0,0,0,0.06);
    }

    h1 {
      text-align: center;
      margin: 5px 0 8px;
      font-size: 27px;
    }

    h2 {
      font-size: 19px;
      margin: 0 0 15px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 20px;
    }

    .status {
      text-align: center;
      padding: 15px;
      border-radius: 14px;
      background: #f5f5f5;
      line-height: 1.7;
      white-space: pre-line;
    }

    .success {
      color: #07883f;
      background: #eaf8f0;
    }

    .error {
      color: #c62828;
      background: #ffebee;
    }

    .info {
      color: #555;
      background: #f5f5f5;
    }

    .student-name {
      font-size: 25px;
      font-weight: bold;
      text-align: center;
      margin: 5px 0;
    }

    .student-id {
      text-align: center;
      color: #666;
      margin-bottom: 15px;
    }

    .course-box {
      background: #f0f8f3;
      border-radius: 15px;
      padding: 15px;
      margin-top: 12px;
    }

    .course-name {
      font-size: 20px;
      font-weight: bold;
      color: #087f3e;
      margin-bottom: 7px;
    }

    .course-date {
      color: #666;
      font-size: 14px;
      line-height: 1.7;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      background: #f7f7f7;
      border-radius: 15px;
      padding: 15px 8px;
      text-align: center;
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
      color: #06a94d;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 13px;
      color: #666;
      line-height: 1.4;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .login-button {
      background: #06c755;
      color: white;
    }

    .checkin-button {
      background: #06c755;
      color: white;
      font-size: 20px;
      padding: 18px;
    }

    .checkin-button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .bind-button {
      background: #333;
      color: white;
    }

    .logout-button {
      background: #eee;
      color: #555;
      font-size: 15px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 17px;
      margin-bottom: 10px;
      outline: none;
    }

    input:focus {
      border-color: #06c755;
    }

    .hidden {
      display: none !important;
    }

    .today-done {
      text-align: center;
      background: #eaf8f0;
      color: #087f3e;
      padding: 17px;
      border-radius: 15px;
      font-weight: bold;
      line-height: 1.7;
    }

    .recent-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 5px;
      border-bottom: 1px solid #eee;
      color: #555;
    }

    .recent-item:last-child {
      border-bottom: none;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 15px;
    }

    .footer {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      margin-top: 25px;
    }

  </style>
</head>

<body>

<div class="container">

  <!-- 標題 -->
  <div class="card">

    <h1>📚 學員上課打卡</h1>

    <div class="subtitle">
      武術協會學員系統
    </div>

    <div
      id="status"
      class="status info"
    >
      正在載入 LINE...
    </div>

  </div>


  <!-- 登入 -->
  <div
    id="loginCard"
    class="card hidden"
  >

    <h2>🔐 LINE 登入</h2>

    <p>
      請使用 LINE 登入後繼續。
    </p>

    <button
      id="loginButton"
      class="login-button"
      onclick="login()"
    >
      使用 LINE 登入
    </button>

  </div>


  <!-- 綁定 -->
  <div
    id="bindCard"
    class="card hidden"
  >

    <h2>🔗 綁定學員</h2>

    <p>
      第一次使用請輸入學生資料。
    </p>

    <input
      id="studentId"
      type="text"
      placeholder="請輸入學員編號"
      autocomplete="off"
    >

    <input
      id="studentName"
      type="text"
      placeholder="請輸入姓名"
      autocomplete="name"
    >

    <button
      id="bindButton"
      class="bind-button"
      onclick="bindStudent()"
    >
      綁定學員
    </button>

  </div>


  <!-- 學員資料 -->
  <div
    id="studentCard"
    class="card hidden"
  >

    <div class="student-name">
      <span id="studentNameDisplay"></span>
    </div>

    <div class="student-id">
      學員編號：
      <strong id="studentIdDisplay"></strong>
    </div>

    <div
      id="courseBox"
      class="course-box"
    >

      <div
        id="courseName"
        class="course-name"
      >
        📚 本期課程
      </div>

      <div
        id="courseDate"
        class="course-date"
      >
      </div>

    </div>

  </div>


  <!-- 統計 -->
  <div
    id="statsCard"
    class="card hidden"
  >

    <h2>📊 上課紀錄</h2>

    <div class="stats">

      <div class="stat">

        <div
          id="courseCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          本期課程<br>
          累計堂數
        </div>

      </div>


      <div class="stat">

        <div
          id="monthlyCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          本月<br>
          上課堂數
        </div>

      </div>


      <div class="stat">

        <div
          id="totalCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          累計<br>
          上課堂數
        </div>

      </div>

    </div>

  </div>


  <!-- 今日打卡 -->
  <div
    id="checkinCard"
    class="card hidden"
  >

    <h2>📅 今日上課</h2>

    <div
      id="todayDone"
      class="today-done hidden"
    >
      ✅ 今日已完成打卡
      <br>
      <span id="todayTime"></span>
    </div>

    <button
      id="checkinButton"
      class="checkin-button"
      onclick="checkin()"
    >
      📚 今日上課打卡
    </button>

  </div>


  <!-- 最近紀錄 -->
  <div
    id="recentCard"
    class="card hidden"
  >

    <h2>📝 最近打卡紀錄</h2>

    <div id="recentList">
    </div>

  </div>


  <!-- 登出 -->
  <div
    id="logoutCard"
    class="card hidden"
  >

    <button
      class="logout-button"
      onclick="logout()"
    >
      登出 LINE
    </button>

  </div>


  <div class="footer">
    學員上課打卡系統 第 27 版
  </div>

</div>


<script>

  /* =================================================
     基本設定
  ================================================= */

  const LIFF_ID =
    '2011153247-E8jjjAjB';

  const API_URL =
    'https://script.google.com/macros/s/AKfycbxvI_ERZ_yv_4nlS1geikXjNseA1tjuHAcYqAySc6RujlfJWG0egt7qZvkuKd2NU-cZuw/exec';


  /* =================================================
     DOM
  ================================================= */

  const statusEl =
    document.getElementById(
      'status'
    );

  const loginCard =
    document.getElementById(
      'loginCard'
    );

  const bindCard =
    document.getElementById(
      'bindCard'
    );

  const studentCard =
    document.getElementById(
      'studentCard'
    );

  const statsCard =
    document.getElementById(
      'statsCard'
    );

  const checkinCard =
    document.getElementById(
      'checkinCard'
    );

  const recentCard =
    document.getElementById(
      'recentCard'
    );

  const logoutCard =
    document.getElementById(
      'logoutCard'
    );


  /* =================================================
     狀態
  ================================================= */

  let lineUserId = '';

  let currentStudent = null;


  /* =================================================
     顯示狀態
  ================================================= */

  function setStatus(
    message,
    type = 'info'
  ) {

    statusEl.innerText =
      message;

    statusEl.className =
      'status ' + type;

  }


  /* =================================================
     隱藏全部
  ================================================= */

  function hideAllCards() {

    loginCard.classList.add(
      'hidden'
    );

    bindCard.classList.add(
      'hidden'
    );

    studentCard.classList.add(
      'hidden'
    );

    statsCard.classList.add(
      'hidden'
    );

    checkinCard.classList.add(
      'hidden'
    );

    recentCard.classList.add(
      'hidden'
    );

    logoutCard.classList.add(
      'hidden'
    );

  }


  /* =================================================
     初始化 LIFF
  ================================================= */

  async function initLIFF() {

    try {

      setStatus(
        '正在載入 LIFF SDK...',
        'info'
      );


      if (
        typeof liff ===
        'undefined'
      ) {

        throw new Error(
          'LIFF SDK 載入失敗'
        );

      }


      setStatus(
        '第 1 階段\nLIFF SDK 已載入，正在初始化...',
        'info'
      );


      await liff.init({

        liffId:
          LIFF_ID

      });


      setStatus(
        '第 2 階段\nLIFF 初始化成功，正在確認 LINE 身分...',
        'info'
      );


      if (
        !liff.isLoggedIn()
      ) {

        hideAllCards();

        loginCard.classList.remove(
          'hidden'
        );

        setStatus(
          '尚未登入 LINE',
          'info'
        );

        return;

      }


      await getLineProfile();

      await loadStudent();

    }

    catch (error) {

      console.error(
        error
      );

      setStatus(
        '❌ 初始化失敗\n\n' +
        getErrorMessage(error),
        'error'
      );

    }

  }


  /* =================================================
     取得 LINE User ID
  ================================================= */

  async function getLineProfile() {

    try {

      const profile =
        await liff.getProfile();


      lineUserId =
        profile.userId;


      if (!lineUserId) {

        throw new Error(
          '無法取得 LINE User ID'
        );

      }


      console.log(
        'LINE User ID:',
        lineUserId
      );

    }

    catch (error) {

      throw new Error(
        '無法取得 LINE 身分：' +
        getErrorMessage(error)
      );

    }

  }


  /* =================================================
     呼叫 API
  ================================================= */

  async function api(
    action,
    params = {}
  ) {

    const query =
      new URLSearchParams();


    query.set(
      'action',
      action
    );


    Object.keys(params)
      .forEach(
        function(key) {

          query.set(
            key,
            params[key]
          );

        }
      );


    const url =
      API_URL +
      '?' +
      query.toString();


    console.log(
      'API:',
      url
    );


    const response =
      await fetch(
        url,
        {
          method: 'GET',
          cache: 'no-store'
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        'API HTTP 錯誤：' +
        response.status
      );

    }


    const text =
      await response.text();


    console.log(
      'API 回應:',
      text
    );


    let data;


    try {

      data =
        JSON.parse(text);

    }

    catch (error) {

      throw new Error(
        'API 回傳不是有效 JSON'
      );

    }


    return data;

  }


  /* =================================================
     載入學生
  ================================================= */

  async function loadStudent() {

    hideAllCards();


    setStatus(
      '正在取得學員資料...',
      'info'
    );


    const data =
      await api(
        'findStudent',
        {
          line_user_id:
            lineUserId
        }
      );


    console.log(
      'findStudent:',
      data
    );


    if (
      !data.success
    ) {

      throw new Error(
        data.message ||
        '取得學員資料失敗'
      );

    }


    if (
      !data.found
    ) {

      bindCard.classList.remove(
        'hidden'
      );

      setStatus(
        '尚未綁定學員\n請輸入你的學員編號與姓名',
        'info'
      );

      return;

    }


    currentStudent =
      data.student;


    await loadDashboard();

  }


  /* =================================================
     載入 Dashboard
  ================================================= */

  async function loadDashboard() {

    setStatus(
      '正在載入學員資料...',
      'info'
    );


    const data =
      await api(
        'studentDashboard',
        {
          line_user_id:
            lineUserId
        }
      );


    console.log(
      'Dashboard:',
      data
    );


    if (
      !data.success
    ) {

      throw new Error(
        data.message ||
        '無法取得最新資料'
      );

    }


    if (
      !data.found
    ) {

      await loadStudent();

      return;

    }


    currentStudent =
      data.student;


    showDashboard(
      data
    );

  }


  /* =================================================
     顯示 Dashboard
  ================================================= */

  function showDashboard(
    data
  ) {

    hideAllCards();


    studentCard.classList.remove(
      'hidden'
    );

    statsCard.classList.remove(
      'hidden'
    );

    checkinCard.classList.remove(
      'hidden'
    );

    recentCard.classList.remove(
      'hidden'
    );

    logoutCard.classList.remove(
      'hidden'
    );


    setStatus(
      '✅ LINE 已綁定學員',
      'success'
    );


    /* -----------------------------
       學員
    ----------------------------- */

    document.getElementById(
      'studentNameDisplay'
    ).innerText =
      data.student.name ||
      '';


    document.getElementById(
      'studentIdDisplay'
    ).innerText =
      data.student.student_id ||
      '';


    /* -----------------------------
       課程
    ----------------------------- */

    if (
      data.course
    ) {

      document.getElementById(
        'courseName'
      ).innerText =
        '📚 ' +
        (
          data.course.name ||
          '本期課程'
        );


      document.getElementById(
        'courseDate'
      ).innerText =
        '課程期間：' +
        (
          data.course.start_date ||
          ''
        ) +
        ' ～ ' +
        (
          data.course.end_date ||
          ''
        );

    }


    /* -----------------------------
       統計
    ----------------------------- */

    const statistics =
      data.statistics ||
      {};


    document.getElementById(
      'courseCount'
    ).innerText =
      Number(
        statistics.totalPoints ||
        0
      );


    document.getElementById(
      'monthlyCount'
    ).innerText =
      Number(
        statistics.monthlyCount ||
        0
      );


    document.getElementById(
      'totalCount'
    ).innerText =
      Number(
        statistics.totalCheckins ||
        0
      );


    /* -----------------------------
       今日打卡
    ----------------------------- */

    updateTodayStatus(
      data.today
    );


    /* -----------------------------
       最近紀錄
    ----------------------------- */

    renderRecent(
      data.recent || []
    );

  }


  /* =================================================
     今日狀態
  ================================================= */

  function updateTodayStatus(
    today
  ) {

    const button =
      document.getElementById(
        'checkinButton'
      );

    const done =
      document.getElementById(
        'todayDone'
      );

    const time =
      document.getElementById(
        'todayTime'
      );


    if (
      today &&
      today.checkedIn
    ) {

      button.classList.add(
        'hidden'
      );

      done.classList.remove(
        'hidden'
      );


      if (
        today.time
      ) {

        time.innerText =
          '打卡時間：' +
          today.time;

      } else {

        time.innerText =
          '';

      }

    }

    else {

      button.classList.remove(
        'hidden'
      );

      button.disabled =
        false;

      done.classList.add(
        'hidden'
      );

      time.innerText =
        '';

    }

  }


  /* =================================================
     綁定學員
  ================================================= */

  async function bindStudent() {

    const studentId =
      document.getElementById(
        'studentId'
      ).value.trim();


    const name =
      document.getElementById(
        'studentName'
      ).value.trim();


    if (!studentId) {

      alert(
        '請輸入學員編號'
      );

      return;

    }


    if (!name) {

      alert(
        '請輸入姓名'
      );

      return;

    }


    const button =
      document.getElementById(
        'bindButton'
      );


    button.disabled =
      true;

    button.innerText =
      '正在綁定...';


    setStatus(
      '正在確認學員資料...',
      'info'
    );


    try {

      const data =
        await api(
          'bindStudent',
          {

            line_user_id:
              lineUserId,

            student_id:
              studentId,

            name:
              name

          }
        );


      console.log(
        'bindStudent:',
        data
      );


      if (
        !data.success
      ) {

        throw new Error(
          data.message ||
          '學員綁定失敗'
        );

      }


      setStatus(
        '✅ 學員綁定成功',
        'success'
      );


      await loadDashboard();

    }

    catch (error) {

      setStatus(
        '❌ 綁定失敗\n\n' +
        getErrorMessage(error),
        'error'
      );

    }

    finally {

      button.disabled =
        false;

      button.innerText =
        '綁定學員';

    }

  }


  /* =================================================
     今日打卡
  ================================================= */

  async function checkin() {

    const button =
      document.getElementById(
        'checkinButton'
      );


    if (
      button.disabled
    ) {

      return;

    }


    button.disabled =
      true;

    button.innerText =
      '正在打卡...';


    setStatus(
      '第 3 階段\n正在寫入今日打卡...',
      'info'
    );


    try {

      const data =
        await api(
          'checkin',
          {

            line_user_id:
              lineUserId

          }
        );


      console.log(
        'checkin:',
        data
      );


      if (
        !data.success
      ) {

        throw new Error(
          data.message ||
          '打卡失敗'
        );

      }


      if (
        data.alreadyCheckedIn
      ) {

        setStatus(
          '✅ 今日已完成打卡',
          'success'
        );

      }

      else {

        setStatus(
          '🎉 打卡成功！',
          'success'
        );

      }


      /*
       * 重新讀取後端資料
       * 讓本期堂數立即更新
       */

      await loadDashboard();

    }

    catch (error) {

      console.error(
        error
      );


      setStatus(
        '❌ 打卡失敗\n\n' +
        getErrorMessage(error),
        'error'
      );


      button.disabled =
        false;

      button.innerText =
        '📚 今日上課打卡';

    }

  }


  /* =================================================
     最近打卡
  ================================================= */

  function renderRecent(
    list
  ) {

    const container =
      document.getElementById(
        'recentList'
      );


    container.innerHTML =
      '';


    if (
      !list ||
      list.length === 0
    ) {

      container.innerHTML =
        '<div class="empty">' +
        '目前還沒有打卡紀錄' +
        '</div>';

      return;

    }


    list.forEach(
      function(item) {

        const div =
          document.createElement(
            'div'
          );


        div.className =
          'recent-item';


        const date =
          document.createElement(
            'span'
          );


        date.innerText =
          item.date ||
          '';


        const time =
          document.createElement(
            'span'
          );


        time.innerText =
          item.time ||
          '';


        div.appendChild(
          date
        );

        div.appendChild(
          time
        );


        container.appendChild(
          div
        );

      }
    );

  }


  /* =================================================
     LINE 登入
  ================================================= */

  function login() {

    try {

      setStatus(
        '第 3 階段\n正在開啟 LINE 登入...',
        'info'
      );


      liff.login();

    }

    catch (error) {

      setStatus(
        '❌ LINE 登入失敗\n\n' +
        getErrorMessage(error),
        'error'
      );

    }

  }


  /* =================================================
     LINE 登出
  ================================================= */

  function logout() {

    try {

      if (
        liff.isLoggedIn()
      ) {

        liff.logout();

      }


      location.reload();

    }

    catch (error) {

      console.error(
        error
      );

      location.reload();

    }

  }


  /* =================================================
     錯誤訊息
  ================================================= */

  function getErrorMessage(
    error
  ) {

    if (
      !error
    ) {

      return '未知錯誤';

    }


    if (
      error.message
    ) {

      return error.message;

    }


    return String(
      error
    );

  }


  /* =================================================
     啟動
  ================================================= */

  initLIFF();

</script>
